<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cómo viaja un clic — guía interactiva del pipeline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d1017; --bg2:#12161f; --surf:#171c26; --surf2:#1e242f;
  --ink:#e8edf5; --soft:#9caabd; --faint:#6d7c91;
  --rule:#28303d; --rule2:#3a4557;

  --gen:#5FD3AE; --kaf:#93A6F5; --fli:#F292B6; --det:#F2B865; --das:#B694F5;
  --ok:#54D6AC; --bad:#FF8168; --warn:#F3C551; --info:#77ADFF; --ml:#B694F5;

  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --disp:'Space Grotesk','Segoe UI',system-ui,sans-serif;
  --body:'Inter','Segoe UI',system-ui,sans-serif;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);font-weight:700;letter-spacing:-.01em;margin:0}
.wrap{max-width:1240px;margin:0 auto;padding:0 18px 110px}

header{position:sticky;top:0;z-index:40;background:rgba(13,16,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--rule)}
.hd{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{margin-right:auto}
.brand h1{font-size:15px}
.brand span{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:5px;flex-wrap:wrap}
.tab{font-family:var(--mono);font-size:11px;border:1px solid var(--rule2);background:transparent;color:var(--soft);padding:5px 10px;border-radius:999px;cursor:pointer;transition:.16s;display:flex;gap:6px;align-items:center}
.tab b{color:var(--faint)}
.tab:hover{border-color:var(--faint);color:var(--ink)}
.tab.sel{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tab.sel b{color:rgba(13,16,23,.5)}
.dbtn{font-family:var(--mono);font-size:11px;border:1px solid var(--rule2);background:transparent;padding:5px 10px;border-radius:8px;cursor:pointer;color:var(--soft)}
.dbtn:hover{border-color:var(--faint);color:var(--ink)}

.stage{margin-top:20px;border:1px solid var(--rule);border-radius:15px;background:var(--bg2);min-height:520px;overflow:hidden;box-shadow:var(--sh)}
.scene{display:none}
.scene.live{display:block}
.sbody{display:grid;grid-template-columns:1fr 350px;min-height:520px}
.sbody.full{grid-template-columns:1fr}
.main{padding:18px 20px;min-width:0}
.insp{border-left:1px solid var(--rule);background:var(--surf);padding:16px 16px 22px;overflow-y:auto;max-height:660px}

.eye{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:12px;display:flex;gap:8px;align-items:center}
.eye::after{content:'';flex:1;height:1px;background:var(--rule)}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.chip{font-family:var(--mono);font-size:10px;padding:2px 7px;border-radius:5px;display:inline-block;white-space:nowrap}
.note{font-size:12.5px;color:var(--soft);background:#2b2413;border:1px dashed #5c4d22;border-radius:9px;padding:9px 11px;line-height:1.5}
.note b{color:#f0cd77}
.warnbox{font-size:12px;color:var(--soft);background:#3f1e16;border:1px dashed #7a3a2a;border-radius:9px;padding:8px 11px}
.warnbox b{color:var(--bad)}

[data-from]{opacity:0;transform:translateY(7px);transition:opacity .4s,transform .4s cubic-bezier(.2,.7,.3,1)}
[data-from].on{opacity:1;transform:none}

/* ── sesiones ── */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:7px}
.scard{border:1px solid var(--rule);border-left:3px solid var(--c);border-radius:9px;background:var(--surf);padding:7px 9px;cursor:pointer;transition:.16s;position:relative}
.scard:hover{border-color:var(--c);transform:translateY(-2px)}
.scard.sel{background:color-mix(in srgb,var(--c) 14%,var(--surf));border-color:var(--c);box-shadow:0 0 0 1px var(--c)}
.scard .sid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--c)}
.scard .sm{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:2px}
.scard .tag{position:absolute;right:6px;top:6px;font-family:var(--mono);font-size:7.5px;padding:1px 5px;border-radius:4px}
.pulse{width:6px;height:6px;border-radius:50%;background:var(--c);display:inline-block;margin-left:4px;animation:pl 1.8s infinite}
@keyframes pl{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* ── json ── */
.jbox{border:1px solid var(--rule);border-radius:9px;overflow:hidden;background:var(--bg2)}
.jbox .jh{padding:6px 10px;border-bottom:1px solid var(--rule);background:var(--surf2);font-family:var(--mono);font-size:10px;color:var(--soft);display:flex;justify-content:space-between}
.jbox pre{margin:0;padding:10px 11px;font-family:var(--mono);font-size:10.5px;line-height:1.8;overflow-x:auto}
.k{color:var(--kaf)} .v{color:var(--gen)} .n{color:var(--fli)}
.jl{display:block;border-radius:3px;padding:0 4px;margin:0 -4px}
.jl.hot{background:color-mix(in srgb,var(--warn) 18%,transparent);box-shadow:inset 2px 0 0 var(--warn)}
.jl.idf{background:color-mix(in srgb,var(--info) 14%,transparent);box-shadow:inset 2px 0 0 var(--info)}
.jl.aud{color:var(--faint)}

/* ── kafka ── */
.tbox{border:1px solid var(--rule);border-radius:10px;background:var(--surf);padding:10px 11px}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.prow .pn{font-family:var(--mono);font-size:9.5px;color:var(--faint);width:66px;flex:none}
.tape{flex:1;display:flex;gap:3px;background:var(--bg2);border:1px solid var(--rule);border-radius:7px;padding:4px;min-height:36px;align-items:center;flex-wrap:wrap}
.cell{width:29px;height:27px;border-radius:5px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;cursor:pointer;background:color-mix(in srgb,var(--c) 20%,var(--bg2));color:var(--c);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);transition:.14s;animation:dr .35s}
.cell:hover{transform:translateY(-2px)}
.cell.sel{box-shadow:0 0 0 2px var(--c);background:color-mix(in srgb,var(--c) 35%,var(--bg2))}
.cell.unread{opacity:.4}
.cell b{font-size:9px;line-height:1} .cell span{font-size:7px;opacity:.75;line-height:1}
.cell.ghost{background:var(--surf2);border-style:dashed;border-color:var(--rule2);color:var(--faint);cursor:default}
@keyframes dr{from{opacity:0;transform:translateY(-10px) scale(.8)}to{opacity:1;transform:none}}
.ptrs{display:flex;gap:14px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:var(--soft);margin-top:8px}
.ptr i{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px}
.lagc{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700}

/* ── flink ── */
.topo{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:12px}
.op{font-family:var(--mono);font-size:9.5px;padding:4px 8px;border-radius:6px;background:var(--surf);border:1px solid var(--rule2);color:var(--soft);white-space:nowrap}
.op.act{background:color-mix(in srgb,var(--fli) 22%,var(--surf));border-color:var(--fli);color:var(--fli);font-weight:700}
.tar{color:var(--faint);font-size:10px}
.lane{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.lane .lid{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c);width:70px;flex:none}
.win{flex:1;border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:8px;background:color-mix(in srgb,var(--c) 10%,var(--surf));min-height:38px;padding:5px 7px;display:flex;align-items:center;gap:4px;flex-wrap:wrap;position:relative;transition:.3s}
.win.closed{background:color-mix(in srgb,var(--c) 24%,var(--surf))}
.ev{width:23px;height:23px;border-radius:5px;background:var(--c);color:var(--bg);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:7.5px;font-weight:700;cursor:pointer;transition:.14s;animation:pp .34s backwards}
.ev:hover{transform:scale(1.14)}
.ev.sel{box-shadow:0 0 0 2px var(--ink)}
@keyframes pp{from{opacity:0;transform:scale(.3) translateX(-14px)}to{opacity:1;transform:none}}
.clk{display:flex;align-items:center;gap:9px;font-family:var(--mono);font-size:10.5px;color:var(--soft);margin-bottom:10px}
.clkbar{flex:1;height:6px;border-radius:3px;background:var(--surf2);overflow:hidden}
.clkbar i{display:block;height:100%;background:var(--fli);width:0;transition:width .5s linear}
.pill{font-family:var(--mono);font-size:10px;padding:3px 9px;border-radius:999px;font-weight:700}

/* vector con identidad */
.vecbox{border:1px solid var(--rule);border-left:3px solid var(--c);border-radius:9px;background:var(--surf);padding:9px 11px}
.vecbox .vh{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c);margin-bottom:6px}
.vtab{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:9.5px}
.vtab td{padding:2px 0}
.vtab td:last-child{text-align:right;font-weight:700}
.vtab tr.id td{color:var(--info)}
.vtab tr.id td:last-child{color:var(--info)}
.vtab tr.mt td{color:var(--soft)}
.vtab tr.mt td:last-child{color:var(--ink)}
.vtab tr.sep td{padding-top:5px;border-top:1px dashed var(--rule)}

/* ── tabla de vectores ── */
.filters{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:9px}
.fb{font-family:var(--mono);font-size:10px;border:1px solid var(--rule2);background:transparent;color:var(--soft);padding:4px 9px;border-radius:7px;cursor:pointer}
.fb:hover{border-color:var(--faint);color:var(--ink)}
.fb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.vwrap{overflow-x:auto;border:1px solid var(--rule);border-radius:9px}
table.vt{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:10px;min-width:640px}
table.vt th{background:var(--surf2);color:var(--faint);font-weight:500;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;padding:6px 5px;text-align:right;border-bottom:1px solid var(--rule);position:sticky;top:0}
table.vt th:first-child,table.vt th:nth-child(2){text-align:left}
table.vt td{padding:5px;text-align:right;border-bottom:1px solid var(--rule);color:var(--soft)}
table.vt td:first-child,table.vt td:nth-child(2){text-align:left}
table.vt tr{cursor:pointer;transition:.12s}
table.vt tr:hover td{background:var(--surf2)}
table.vt tr.sel td{background:color-mix(in srgb,var(--info) 16%,var(--surf));color:var(--ink)}
.vd{font-family:var(--mono);font-size:8.5px;padding:1px 6px;border-radius:4px;font-weight:700}
.vd.rule{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.vd.ml{background:color-mix(in srgb,var(--ml) 22%,transparent);color:var(--ml)}
.vd.both{background:color-mix(in srgb,var(--bad) 20%,transparent);color:var(--bad)}
.vd.none{background:var(--surf2);color:var(--faint)}
.stats{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}
.st{border:1px solid var(--rule);border-radius:8px;background:var(--surf);padding:6px 10px;flex:1;min-width:106px}
.st .sv{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--c)}
.st .sl{font-size:9.5px;color:var(--faint);line-height:1.3}

/* evaluación en inspector */
.evalrow{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule)}
.evalrow .ic{width:17px;height:17px;border-radius:5px;flex:none;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;margin-top:1px}
.ic.yes{background:color-mix(in srgb,var(--bad) 25%,transparent);color:var(--bad)}
.ic.no{background:var(--surf2);color:var(--faint)}
.evalrow .et{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--ink)}
.evalrow .ed{font-size:11px;color:var(--soft);line-height:1.45;margin-top:2px}
.evalrow .ec{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:3px}

/* ── docker / capas ── */
.ctns{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}
.ctn{border:1px solid var(--rule);border-top:3px solid var(--c);border-radius:10px;background:var(--surf);padding:9px 11px;cursor:pointer;transition:.16s}
.ctn:hover{transform:translateY(-2px);border-color:var(--c)}
.ctn.sel{background:color-mix(in srgb,var(--c) 14%,var(--surf));box-shadow:0 0 0 1px var(--c)}
.ctn .cn{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--c)}
.ctn .ci{font-family:var(--mono);font-size:9px;color:var(--faint);margin-top:2px}
.netbox{border:1.5px dashed var(--kaf);border-radius:12px;padding:14px;position:relative;margin-bottom:12px}
.netbox .nl{position:absolute;top:-9px;left:14px;background:var(--bg2);padding:0 8px;font-family:var(--mono);font-size:9.5px;color:var(--kaf);font-weight:700}
.layers{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.layer{border:1px solid var(--rule);border-radius:10px;background:var(--surf);padding:10px 8px;text-align:center;cursor:pointer;transition:.3s}
.layer:hover{transform:translateY(-2px)}
.layer.hot{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surf));box-shadow:0 0 0 1px var(--c)}
.layer .ln{font-family:var(--mono);font-size:10px;font-weight:700;color:var(--c)}
.layer .lf{font-family:var(--mono);font-size:8px;color:var(--faint);margin-top:3px;word-break:break-all}
.kb{font-family:var(--mono);font-size:8px;background:color-mix(in srgb,var(--kaf) 18%,transparent);color:var(--kaf);border-radius:4px;padding:1px 5px;display:inline-block;margin-top:5px}

/* ── narración ── */
.narr{margin-top:15px;display:grid;grid-template-columns:1.6fr 1fr;gap:15px;align-items:start}
.nm h2{font-size:18px;margin-bottom:6px}
.nm p{margin:0 0 8px;color:var(--soft);font-size:13.5px}
.nm code{font-family:var(--mono);font-size:12px;background:var(--surf2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.nm b{color:var(--ink)}
.side{display:flex;flex-direction:column;gap:8px}
.expb{font-family:var(--mono);font-size:11px;text-align:left;border:1px solid var(--bad);background:transparent;color:var(--bad);padding:8px 11px;border-radius:9px;cursor:pointer;line-height:1.4}
.expb:hover{background:color-mix(in srgb,var(--bad) 15%,transparent)}
.expb.on{background:var(--bad);color:var(--bg)}
.quiz{border:1px solid var(--rule);border-radius:9px;background:var(--surf);padding:10px 12px}
.quiz p{margin:0 0 7px;font-size:12.5px;font-weight:600}
.quiz .ans{display:none;font-size:12px;color:var(--soft);border-top:1px dashed var(--rule);padding-top:7px}
.quiz.open .ans{display:block}
.quiz button{font-family:var(--mono);font-size:10.5px;border:1px solid var(--rule2);background:var(--surf2);padding:4px 9px;border-radius:6px;cursor:pointer;color:var(--soft)}

/* ── controles ── */
.ctrl{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(13,16,23,.94);backdrop-filter:blur(10px);border-top:1px solid var(--rule)}
.ci2{max-width:1240px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px}
.nb{font-family:var(--disp);font-size:12.5px;border:1px solid var(--rule2);background:transparent;color:var(--ink);padding:7px 14px;border-radius:8px;cursor:pointer}
.nb:hover:not(:disabled){border-color:var(--ink)}
.nb:disabled{opacity:.3;cursor:default}
.nb.pri{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.dots{display:flex;gap:4px;margin:0 auto;flex-wrap:wrap;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%;background:var(--rule2);cursor:pointer;transition:.2s}
.dot.on{background:var(--ink);transform:scale(1.35)}
.dot.past{background:var(--faint)}
.pos{font-family:var(--mono);font-size:10px;color:var(--faint);min-width:64px;text-align:right}

/* ── cajones ── */
.drw{position:fixed;top:0;right:0;bottom:0;width:min(460px,94vw);background:var(--bg2);border-left:1px solid var(--rule);z-index:60;transform:translateX(101%);transition:transform .3s cubic-bezier(.2,.8,.3,1);overflow-y:auto;box-shadow:-8px 0 40px rgba(0,0,0,.5)}
.drw.open{transform:none}
.drw .dh{position:sticky;top:0;background:var(--bg2);padding:15px 17px 10px;border-bottom:1px solid var(--rule);display:flex;align-items:center;z-index:2}
.drw .dh h3{font-size:14px;margin-right:auto}
.drw .dh button{border:none;background:none;font-size:21px;cursor:pointer;color:var(--faint);line-height:1}
.drw table{width:100%;border-collapse:collapse}
.drw td{padding:8px 17px;border-bottom:1px solid var(--rule);vertical-align:top;font-size:12px;color:var(--soft)}
.drw td:first-child{font-family:var(--mono);font-weight:700;color:var(--ink);white-space:nowrap;width:1%}
.drw td em{display:block;font-style:normal;color:var(--faint);font-size:10.5px;font-family:var(--body);margin-top:2px}
.drw tr.warn td:first-child{color:var(--bad)}
.oh{padding:13px 17px 5px;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.oi{padding:10px 17px;border-bottom:1px solid var(--rule)}
.oi .ot{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--ink);display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.oi .od{font-size:12px;color:var(--soft);margin-top:4px;line-height:1.5}
.oi .on{font-size:11.5px;margin-top:6px;padding:6px 9px;border-radius:7px;line-height:1.45}
.on.ok{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 30%,transparent)}
.on.par{background:color-mix(in srgb,var(--warn) 12%,transparent);color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.on.fut{background:color-mix(in srgb,var(--info) 12%,transparent);color:var(--info);border:1px solid color-mix(in srgb,var(--info) 30%,transparent)}
.badge{font-family:var(--mono);font-size:8px;padding:1px 6px;border-radius:4px;font-weight:700}
.b-ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.b-par{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.b-fut{background:color-mix(in srgb,var(--info) 22%,transparent);color:var(--info)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:55;opacity:0;pointer-events:none;transition:.3s}
.scrim.open{opacity:1;pointer-events:auto}

.ihint{font-size:11.5px;color:var(--faint);text-align:center;padding:26px 10px;line-height:1.6;font-style:italic}

@media(max-width:900px){
  .sbody{grid-template-columns:1fr}
  .insp{border-left:none;border-top:1px solid var(--rule);max-height:none}
  .narr{grid-template-columns:1fr}
  .layers{grid-template-columns:1fr 1fr}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header><div class="hd">
  <div class="brand"><h1>Cómo viaja un clic</h1><span>Faker · Kafka · Flink · Detección híbrida</span></div>
  <div class="tabs" id="tabs"></div>
  <button class="dbtn" id="objBtn">Objetivos e hipótesis</button>
  <button class="dbtn" id="gloBtn">Glosario</button>
</div></header>

<div class="wrap">
  <div class="stage" id="stage"></div>
  <div class="narr">

/* lógica REAL de las reglas, tal cual anomaly_detector.py */
function rules(v){
  const r=[];
  r.push({n:'R1',lbl:'CRITICAL_RULE',hit:v.dev==='bot_scraper',
    cond:`device == "bot_scraper"`, got:`device = "${v.dev}"`,
    why:'Firma explícita de automatización. El generador sobrescribe el dispositivo real del usuario por <code>bot_scraper</code>, así que la coincidencia es exacta y determinista.'});
  r.push({n:'R2',lbl:'PERFORMANCE_RULE',hit:v.lat>2000,
    cond:'avg_latency_ms > 2000.0', got:`avg_latency_ms = ${fmt(v.lat)}`,
    why:'Degradación sostenida de infraestructura. Compara el <b>promedio de la ventana</b>, no picos aislados: un solo evento lento queda diluido por los rápidos.'});
  r.push({n:'R3',lbl:'SECURITY_RULE',hit:v.cl>35,
    cond:'clicks_count > 35', got:`clicks_count = ${v.cl}`,
    why:'Denegación de servicio potencial. <b>Nunca se dispara en este proyecto:</b> el generador limita cada sesión a <code>max_events = randint(4, 15)</code>, y el máximo observado en los 13.696 registros reales es 14.'});
  const first = r.find(x=>x.hit);
  return {list:r, fired:!!first, first:first?first.n:null, reason:first?first.lbl:null};
}
function verdict(v){
  const R=rules(v);
  if(R.fired&&v.ml) return {c:'both',t:'AMBAS'};
  if(R.fired)       return {c:'rule',t:'REGLA'};
  if(v.ml)          return {c:'ml',  t:'SOLO ML'};
  return {c:'none',t:'sin alerta'};
}

      <div style="margin-top:11px;font-size:12.5px;color:var(--soft);line-height:1.5">
        ${nokey
          ? '<b style="color:var(--bad)">Sin clave.</b> Kafka reparte por turnos. Los eventos de esta sesión están dispersos entre las tres particiones, así que ningún operador de Flink verá la sesión completa.'
          : N===1
            ? `Con una sola partición el módulo siempre da 0, así que <b>todo</b> aterriza aquí. El enrutamiento por clave sigue implementado (<code>key=${f.s.id}</code>) y sería determinista con cualquier número de particiones.`
            : `Al enviarse con <code>key=${f.s.id}</code>, el hash es determinista: <b>todos</b> los eventos de esta sesión caen en la partición ${f.s.p}. Nunca se dispersan.`}
      </div>
      <div style="margin-top:10px;font-size:12px;color:var(--soft);line-height:1.5">
        ${un?'<b style="color:var(--bad)">Aún no leído.</b> Está escrito y persistido: si Flink cae ahora, lo encontrará intacto al reanudar.'
            :'<b style="color:var(--ok)">Ya leído por Flink.</b> Y sigue en disco — leer <b>no</b> destruye. Otro consumidor puede volver a leerlo cuando quiera.'}
      </div>
      <div class="note" style="margin-top:10px;font-size:11.5px">
        El dashboard <code>app.py</code> lee este mismo tópico con otro <code>group_id</code>, así que tiene su propio puntero. Dos consumidores, dos ritmos, un solo log.</div>`;
    }
  }
  return {main,insp};
}

/* ════════════ ESCENA 2 · FLINK ════════════ */
const OPMAP={0:[0],1:[1,2],2:[3,4],3:[4],4:[5],5:[6],6:[7]};
function sc2(step){
  const ops=['from_source <span class="n">Kafka</span>','map <span class="n">deserialize</span>','filter <span class="n">CORRUPT</span>',
             'key_by <span class="n">session_id</span>','window <span class="n">Tumbling 10s</span>','reduce <span class="n">acumula</span>',
             'map <span class="n">vector</span>','sink_to <span class="n">Kafka</span>'];
  const topo=ops.map((o,i)=>`<span class="op${(OPMAP[step]||[]).includes(i)?' act':''}">${o}</span>`)
                .join('<span class="tar">→</span>');

  const merged = EXP.nokeyby && step>=2;
  let lanesHtml;
  if(merged){
    const all=[]; LANES.forEach(l=>l.evs.forEach(e=>all.push([l.sid,e])));
    const tot=all.length, sum=all.reduce((a,[,e])=>a+e[1],0);
    lanesHtml=`<div class="lane" style="--c:var(--faint)">
      <span class="lid" style="color:var(--bad)">TODAS</span>
      <div class="win">${all.map(([sid,e])=>`<div class="ev" style="background:${S[sid].c}">${EVAB[e[0]]}</div>`).join('')}</div></div>
      <div class="warnbox" style="margin-top:9px"><b>Una sola ventana global.</b> clicks_count = ${tot} · avg_latency_ms = ${fmt(sum/tot)} — un promedio que no describe a nadie. El bot queda diluido entre los humanos y <b>la anomalía desaparece</b>.</div>`;
  } else {
    lanesHtml=LANES.map(l=>{
      const s=S[l.sid];
      // llenado progresivo: key_by ya reparte, el reloj termina de llenar
      const vis = step<2 ? 0 : (step===2 ? Math.max(1,Math.ceil(l.evs.length*0.35))
                              : (step===3 ? Math.max(2,Math.ceil(l.evs.length*0.75)) : l.evs.length));
      const evs=l.evs.slice(0,vis).map((e,i)=>`<div class="ev${sel[2]===l.sid+':'+i?' sel':''}" data-act="s2" data-sid="${l.sid}" data-i="${i}" style="animation-delay:${(i*0.07).toFixed(2)}s">${EVAB[e[0]]}</div>`).join('');
      const wait = (step>=2 && vis<l.evs.length) ? `<span style="position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:8.5px;color:${s.c};opacity:.65">acumulando…</span>` : '';
      return `<div class="lane" style="--c:${s.c}"><span class="lid">${s.id}</span>
        <div class="win${step>=4?' closed':''}">${evs}${wait}</div>
        <span class="chip" style="background:var(--surf2);color:var(--faint)">slot ${LANES.indexOf(l)%2+1}</span></div>`;
    }).join('');
  }

  let vecs='';
  if(step>=5&&!merged){
    vecs=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:8px;margin-top:11px">`+
      LANES.map(l=>{const s=S[l.sid],a=agg(l);
      return `<div class="vecbox" style="--c:${s.c}"><div class="vh">${s.id}</div>
        <table class="vtab">
          <tr class="id"><td>session_id</td><td>${s.id}</td></tr>
          <tr class="id"><td>user_id</td><td>${s.u}</td></tr>
          <tr class="id"><td>ip_address</td><td>${s.ip}</td></tr>
          <tr class="id"><td>device</td><td>${s.dev}</td></tr>
          <tr class="mt sep"><td>clicks_count</td><td>${a.clicks}</td></tr>
          <tr class="mt"><td>avg_latency_ms</td><td>${fmt(a.avg)}</td></tr>
          <tr class="mt"><td>page_views_count</td><td>${a.pv}</td></tr>
          <tr class="mt"><td>cart_adds_count</td><td>${a.ca}</td></tr>
          <tr class="mt"><td>checkout_starts_count</td><td>${a.ck}</td></tr>
          <tr class="mt"><td>purchases_count</td><td>${a.pu}</td></tr>
        </table></div>`;}).join('')+`</div>
      <div class="note" style="margin-top:9px"><span style="color:var(--info)">■</span> <b>4 campos de identidad</b> — viajan en la raíz del JSON, fuera de <code>feature_metrics</code>. <code>device</code> no es una de las 6 características, pero sin él R1 no podría funcionar.<br><span style="color:var(--ink)">■</span> <b>6 métricas</b> — una media y cinco sumas. Es lo único que Isolation Forest llega a ver.</div>`;
  }

  const pct=step<2?0:(step===2?30:(step===3?70:100));
  const main=`<div class="eye">Capa 3 · Apache Flink (PyFlink)</div>
    <div class="topo">${topo}</div>
    <div data-from="2" class="clk">
      <span class="pill" style="background:${merged?'rgba(255,129,104,.2)':'rgba(242,146,182,.18)'};color:${merged?'var(--bad)':'var(--fli)'}">ventanas activas: ${merged?'1 ✕':(step>=2?4:0)}</span>
      <div class="clkbar"><i style="width:${pct}%"></i></div>
      <span style="font-family:var(--mono);font-weight:700;color:var(--fli)">t = ${step<2?0:(step===2?3:(step===3?7:10))} s</span></div>
    ${lanesHtml}
    ${step>=2&&!merged?'<div class="lbl" style="margin-top:8px">pulsa cualquier evento para ver qué aporta al acumulador</div>':''}
    ${vecs}
    <div data-from="6" style="margin-top:10px" class="warnbox">
      <b>Dos aclaraciones honestas.</b> Se usa <code>TumblingProcessingTimeWindows</code> con <code>no_watermarks()</code> → <b>processing time</b>, no event time. Y PyFlink se ejecuta <b>embebido en el host</b>; el clúster Docker es infraestructura objetivo.</div>`;

  let insp;
  if(!sel[2]||step<2||merged){
    insp=`<div class="ihint">${merged?'Restaura el key_by para inspeccionar eventos.':'Pulsa un evento dentro de una ventana<br>para ver su aporte al acumulador.'}</div>`;
  } else {
    const [sid,ix]=sel[2].split(':'); const l=LANES.find(x=>x.sid===sid);
    if(!l){insp=`<div class="ihint">Selecciona un evento.</div>`;}
    else{
      const i=+ix, [t,lat]=l.evs[i], s=S[sid], a=agg(l);
      let run=0,rt=0,pv=0,ca=0,ck=0,pu=0;
      for(let j=0;j<=i;j++){ run++; rt+=l.evs[j][1]; const t2=l.evs[j][0];
        if(t2==='page_view')pv++; if(t2==='add_to_cart')ca++;
        if(t2==='checkout_start')ck++; if(t2==='purchase')pu++; }
      insp=`<div class="lbl">Evento seleccionado</div>
      <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:${s.c};margin:3px 0 9px">${s.id} · #${i+1}</div>
      <table class="vtab" style="font-size:11px">
        <tr class="id"><td>event_type</td><td>${t}</td></tr>
        <tr class="id"><td>latency</td><td>${fmt0(lat)} ms</td></tr>
      </table>
      <div class="lbl" style="margin-top:13px">lo que aporta al reduce</div>
      <div style="font-family:var(--mono);font-size:11px;background:var(--surf2);border-radius:8px;padding:9px 10px;margin-top:5px;line-height:1.9">
        clicks &nbsp;&nbsp;<span style="color:var(--ok)">+1</span><br>
        total_lat <span style="color:var(--ok)">+${fmt0(lat)}</span><br>
        ${EVFIELD[t]} <span style="color:var(--ok)">+1</span>
      </div>
      <div class="lbl" style="margin-top:13px">acumulador tras este evento</div>
      <table class="vtab" style="font-size:10.5px;background:var(--surf2);border-radius:8px;margin-top:5px">
        <tr class="mt"><td style="padding-left:9px">clicks</td><td style="padding-right:9px">${run}</td></tr>
        <tr class="mt"><td style="padding-left:9px">total_lat</td><td style="padding-right:9px">${fmt0(rt)}</td></tr>
        <tr class="mt"><td style="padding-left:9px">page_views_count</td><td style="padding-right:9px">${pv}</td></tr>
        <tr class="mt"><td style="padding-left:9px">cart_adds_count</td><td style="padding-right:9px">${ca}</td></tr>
        <tr class="mt"><td style="padding-left:9px">checkout_starts_count</td><td style="padding-right:9px">${ck}</td></tr>
        <tr class="mt"><td style="padding-left:9px">purchases_count</td><td style="padding-right:9px">${pu}</td></tr>
        <tr><td style="padding:4px 9px 7px;color:var(--faint)" colspan="2">avg_latency_ms — todavía no existe</td></tr>
      </table>
      <div style="margin-top:11px;font-size:12px;color:var(--soft);line-height:1.5">
        El <code>reduce</code> <b>no divide nunca</b>. Solo acumula numerador y denominador por separado, porque <b>los promedios no son asociativos</b>: promediar promedios daría un resultado distinto según el orden de combinación.</div>
      ${i===l.evs.length-1?`<div class="note" style="margin-top:10px">
        <b>Último evento de la ventana.</b> Al cerrar, <code>build_final_feature_vector</code> divide una sola vez:<br>
        <span style="font-family:var(--mono);font-size:11.5px">${fmt0(a.tot)} / ${a.clicks} = ${fmt(a.avg)}</span></div>`:''}`;
    }
  }
  return {main,insp};
}

/* ════════════ ESCENA 3 · DETECCIÓN HÍBRIDA ════════════ */
function sc3(step){
  const shown = VEC.filter(v=>{
    if(filt==='all')return true;
    return verdict(v).c===filt;
  });
  const rows=shown.map(v=>{
    const V=verdict(v), R=rules(v);
    return `<tr class="${sel[3]===v.id?'sel':''}" data-act="s3" data-id="${v.id}">
      <td style="color:var(--ink)">${v.id}</td>
      <td style="color:${v.dev==='bot_scraper'?'var(--bad)':'var(--faint)'}">${v.dev}</td>
      <td>${v.cl}</td><td style="color:${v.lat>2000?'var(--bad)':'var(--soft)'}">${fmt(v.lat)}</td>
      <td>${v.pv}</td><td>${v.ca}</td>
      <td style="color:${v.ck>4?'var(--warn)':'var(--soft)'}">${v.ck}</td>
      <td style="color:${v.pu===0&&v.ck>4?'var(--warn)':'var(--soft)'}">${v.pu}</td>
      <td style="color:var(--faint)">${R.first||'—'}</td>
      <td style="color:${v.ml?'var(--ml)':'var(--faint)'}">${v.ml?fmt(v.sc).replace('-','−'):'—'}</td>
      <td><span class="vd ${V.c}">${V.t}</span></td></tr>`;
  }).join('');

  const cnt=c=>VEC.filter(v=>verdict(v).c===c).length;
  const main=`<div class="eye">Capa 4 · anomaly_detector.py — detección híbrida</div>
    <div data-from="0" class="stats">
      <div class="st" style="--c:var(--warn)"><div class="sv">5.886</div><div class="sl">alertas por reglas<br><span style="color:var(--faint)">43,0 % · dato real</span></div></div>
      <div class="st" style="--c:var(--ml)"><div class="sv">7.810</div><div class="sl">exclusivas de ML<br><span style="color:var(--faint)">57,0 % · dato real</span></div></div>
      <div class="st" style="--c:var(--bad)"><div class="sv">686</div><div class="sl">detectadas por ambas<br><span style="color:var(--faint)">5,0 % · dato real</span></div></div>
      <div class="st" style="--c:var(--ok)"><div class="sv">14</div><div class="sl">clics máximos observados<br><span style="color:var(--faint)">umbral R3 = 35</span></div></div>
    </div>
    <div data-from="5" class="filters">
      ${[['all','todos ('+VEC.length+')'],['rule','solo regla ('+cnt('rule')+')'],['ml','solo ML ('+cnt('ml')+')'],['both','ambas ('+cnt('both')+')'],['none','sin alerta ('+cnt('none')+')']]
        .map(([k,l])=>`<button class="fb${filt===k?' on':''}" data-act="filt" data-k="${k}">${l}</button>`).join('')}
    </div>
    <div class="vwrap"><table class="vt">
      <tr><th>vector</th><th>device</th><th>clics</th><th>lat. media</th><th>PV</th><th>CA</th><th>CK</th><th>PU</th><th>regla</th><th>ML score</th><th>veredicto</th></tr>
      ${rows}</table></div>
    <div style="margin-top:9px" class="warnbox">
      <b>Vectores ilustrativos.</b> Reconstruidos según las distribuciones del generador — el CSV de alertas solo conserva <code>Clicks</code> y <code>Avg_Latency_ms</code>, no los cuatro contadores por tipo de evento. Las tres cifras de arriba <b>sí</b> son medidas reales. Los <code>ML_Score</code> usan el rango observado (−0,67 a −0,60) pero <b>no están computados</b>: no cites estos 20 vectores como datos experimentales.</div>`;

  const v=VEC.find(x=>x.id===sel[3])||VEC[6];
  const R=rules(v), V=verdict(v), K=KIND[v.k]||{t:'borde',col:'var(--info)',bg:'rgba(119,173,255,.18)',d:'Caso construido para mostrar el efecto del umbral de R2.'};
  const insp=`<div class="lbl">Vector seleccionado</div>
    <div style="font-family:var(--mono);font-size:15px;font-weight:700;margin:3px 0 4px">${v.id}</div>
    <span class="vd ${V.c}" style="font-size:9.5px">${V.t}</span>
    <span class="chip" style="background:${K.bg};color:${K.col};margin-left:5px">${K.t}</span>

    <div class="lbl" style="margin-top:13px">capa 1 · reglas heurísticas</div>
    ${R.list.map(r=>`<div class="evalrow">
      <div class="ic ${r.hit?'yes':'no'}">${r.hit?'✓':'✗'}</div>
      <div><div class="et">${r.n} — ${r.lbl}</div>
        <div class="ec">${r.cond}<br>${r.got}</div>
        <div class="ed">${r.why}</div></div></div>`).join('')}
    <div style="font-size:11.5px;color:var(--faint);margin-top:7px;line-height:1.5">
      Se evalúan en orden con <b>cortocircuito</b>: la primera coincidencia corta la función.
      ${R.fired?`Aquí disparó <b style="color:var(--warn)">${R.first}</b>, así que las siguientes ni se comprueban.`:'Ninguna coincidió, así que se evaluaron las tres.'}
    </div>

    <div class="lbl" style="margin-top:15px">capa 2 · isolation forest</div>
    <div class="evalrow">
      <div class="ic ${v.ml?'yes':'no'}">${v.ml?'✓':'✗'}</div>
      <div><div class="et">ML — ${v.ml?'anomalía aislada':'dentro de lo normal'}</div>
        <div class="ec">ml_anomaly_score = ${fmt(v.sc).replace('-','−')}</div>
        <div class="ed">${v.ml
          ? 'El vector queda aislado en pocos cortes del árbol: su <b>combinación</b> de valores es infrecuente aunque ningún campo aislado sea extremo.'
          : 'El vector cae en la zona densa del espacio de 6 dimensiones. Hace falta un camino largo para aislarlo, así que se considera normal.'}</div></div></div>
    <div style="font-size:11.5px;color:var(--faint);margin-top:5px;line-height:1.5">
      La capa ML se ejecuta <b>siempre</b>, dispare o no una regla. No hay cortocircuito entre capas — por eso existen los casos «AMBAS».</div>

    <div style="margin-top:13px;padding:9px 11px;border-radius:8px;background:var(--surf2);font-size:12px;color:var(--soft);line-height:1.5">
      <b style="color:var(--ink)">Lectura del caso.</b><br>${K.d}</div>`;
  return {main,insp};
}

function sc6(step){
  const N=parts;
  const cells=Array.from({length:N},()=>[]);
  const vis = step===0 ? 4 : VSTREAM.length;
  VSTREAM.slice(0,vis).forEach((v,i)=>{
    const p = N===1 ? 0 : (i%3);          // sin clave → round-robin
    cells[p].push({v,i,p,off:cells[p].length});
  });

  const tapes=cells.map((list,p)=>{
    const inner=list.length?list.map(c=>
      `<div class="cell${sel[6]===c.i?' sel':''}" style="--c:${S[c.v.sid].c};width:40px" data-act="s6" data-i="${c.i}">
        <b>${c.v.sid.slice(5,8)}</b><span>w${c.v.w}</span></div>`).join('')
      :'<div class="cell ghost">·</div>';
    return `<div class="prow"><span class="pn">partition ${p}</span><div class="tape">${inner}</div></div>`;
  }).join('');

  const tog=`<div class="filters" style="margin-bottom:11px">
    <span class="lbl" style="align-self:center;margin-right:4px">vista</span>
    <button class="fb${N===1?' on':''}" data-act="parts" data-n="1">1 partición · despliegue real</button>
    <button class="fb${N===3?' on':''}" data-act="parts" data-n="3">3 particiones · al escalar</button></div>`;

  // localizar dinámicamente una sesión dispersa y otra agrupada por casualidad
  let disp='', agru='';
  if(N===3){
    const porSid={};
    [].concat(...cells).forEach(c=>{(porSid[c.v.sid]=porSid[c.v.sid]||new Set()).add(c.p);});
    for(const k in porSid){ if(porSid[k].size>1 && !disp) disp=k; if(porSid[k].size===1 && !agru) agru=k; }
  }
  const contraste = N===3
   ? `<div class="warnbox" style="margin-top:10px"><b>Sin clave no hay agrupación garantizada.</b> Compáralo con la escena 2: allí cada sesión ocupaba <b>siempre</b> su propia fila, por diseño. Aquí <code>${disp}</code> queda repartida entre varias particiones.
      ${agru?`<p style="margin:6px 0 0">Y fíjate en <code>${agru}</code>: quedó toda en una sola fila — pero <b>por casualidad</b>, no por garantía. El reparto por turnos puede coincidir; no lo asegura.</p>`:''}
      <p style="margin:6px 0 0">La causa está en el código: el <code>KafkaRecordSerializationSchema</code> del sink solo define <code>setValueSerializationSchema</code>. <b>No hay clave</b>, así que no hay hash — Kafka reparte por turnos.</p>
      <p style="margin:6px 0 0"><b>Y no importa.</b> Con 1 partición o con 3 el resultado es idéntico, porque el detector evalúa cada vector aislado. Aquí la partición es indiferente; en <code>ecommerce-events</code> era imprescindible.</p></div>`
   : `<div class="note" style="margin-top:10px"><b>Con una partición no se nota la diferencia.</b> Todo aterriza en la misma cinta, igual que en <code>ecommerce-events</code>.
      <p style="margin:6px 0 0">Cambia a <b>3 particiones</b> para ver el contraste: aquí los colores <b>no</b> se agruparían, porque el sink no envía clave.</p></div>`;

  const main=`<div class="eye">Kafka · retail-feature-vectors — el tópico intermedio</div>
    ${tog}
    <div data-from="0" class="prow" style="margin-bottom:10px;flex-wrap:wrap">
      <span class="chip" style="background:color-mix(in srgb,var(--fli) 20%,transparent);color:var(--fli)">Flink · sink_to()</span>
      <span class="tar">→</span>
      <span class="chip" style="background:var(--surf2);color:var(--soft)">localhost:9094</span>
      <span class="tar">→</span>
      <span class="chip" style="background:color-mix(in srgb,var(--kaf) 20%,transparent);color:var(--kaf)">retail-feature-vectors</span>
      <span class="tar">→</span>
      <span class="chip" style="background:color-mix(in srgb,var(--det) 20%,transparent);color:var(--det)">detector</span></div>
    <div class="tbox">
      <div style="display:flex;gap:9px;align-items:center;margin-bottom:9px;flex-wrap:wrap">
        <span class="lbl">topic</span>
        <span style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--kaf)">retail-feature-vectors</span>
        <span class="chip" style="background:rgba(255,129,104,.18);color:var(--bad)">sin clave</span>
      </div>
      ${tapes}
    </div>
    <div data-from="1">${contraste}</div>
    <div data-from="2" style="margin-top:9px" class="note">
      <b>Cada mensaje ya es una unidad completa.</b> En <code>ecommerce-events</code> la clave era imprescindible: había que juntar 12 eventos dispersos para reconstruir una sesión. Aquí cada vector llega cerrado, con sus 6 métricas calculadas. El detector lo evalúa aislado, sin necesitar nada de sus vecinos ni del orden de llegada.
      <p style="margin:6px 0 0">Pulsa cualquier vector para inspeccionarlo.</p></div>

  let insp;
  if(sel[6]===null||sel[6]===undefined){
    insp=`<div class="ihint">Pulsa un vector del log<br>para ver sus 6 métricas.</div>`;
  } else {
    const f=[].concat(...cells).find(c=>c.i===sel[6]);
    if(!f){ insp=`<div class="ihint">Ese vector no está en la vista actual.</div>`; }
    else{
      const v=f.v, sX=S[v.sid], K=KIND[sX.k];
      const otras=VSTREAM.filter(x=>x.sid===v.sid).map(x=>'w'+x.w).join(', ');
      insp=`<div class="lbl">Vector seleccionado</div>
      <div style="font-family:var(--mono);font-size:14px;font-weight:700;color:${sX.c};margin:3px 0 3px">${v.sid}</div>
      <div style="font-family:var(--mono);font-size:10.5px;color:var(--faint);margin-bottom:10px">ventana ${v.w} · partición ${f.p} · offset ${f.off}</div>
      <table class="vtab" style="font-size:10.5px">
        <tr class="id"><td>device</td><td>${sX.dev}</td></tr>
        <tr class="mt sep"><td>clicks_count</td><td>${v.cl}</td></tr>
        <tr class="mt"><td>avg_latency_ms</td><td>${fmt(v.lat)}</td></tr>
        <tr class="mt"><td>page_views_count</td><td>${v.pv}</td></tr>
        <tr class="mt"><td>cart_adds_count</td><td>${v.ca}</td></tr>
        <tr class="mt"><td>checkout_starts_count</td><td>${v.ck}</td></tr>
        <tr class="mt"><td>purchases_count</td><td>${v.pu}</td></tr>
      </table>
      <div style="margin-top:11px;font-size:12px;color:var(--soft);line-height:1.5">
        Esta sesión emitió vectores en las ventanas <b>${otras}</b>. ${N===3?'Sin clave, cada uno cayó donde tocaba por turno — sin ninguna garantía de que compartan partición.':'Con una partición todos comparten cinta. Al escalar, el reparto sería por turnos: sin clave, no habría agrupación garantizada.'}
      </div>
      <div class="note" style="margin-top:10px">
        <b>Cada ventana se juzga por separado.</b> El detector no sabe que esta misma sesión ya emitió otros vectores. Las ventanas <i>tumbling</i> son amnésicas: al cerrar, el estado se vacía.</div>
      ${sX.k!=='normal'?`<div style="margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--surf2);font-size:11.5px;color:var(--soft);line-height:1.5">
        <b style="color:${K.col};font-family:var(--mono);font-size:10px">${K.t}</b><br>${K.sig}</div>`:''}`;
    }
  }
  return {main,insp};
}

 {t:'Sin clave: aquí Kafka reparte por turnos',b:`Diferencia clave con <code>ecommerce-events</code>. Allí el productor enviaba <code>key=session_id</code> y el hash agrupaba. Aquí el serializador del sink <b>solo define el valor</b> — no hay clave, no hay hash.<p>Usa el conmutador para ver el contraste. Ojo al matiz: sin clave <b>no hay agrupación garantizada</b>. Alguna sesión puede quedar toda en la misma fila, pero por casualidad del reparto por turnos — no porque Kafka lo asegure.</p>`},
 {t:'¿Y por qué no importa?',b:`Porque el trabajo pesado ya está hecho. Cada mensaje es un vector <b>cerrado y autosuficiente</b>, no un fragmento que haya que juntar con otros.<p>Pulsa cualquier vector: verás sus 6 métricas ya calculadas y de qué ventana viene. El detector no necesita nada más.</p>`},
 {t:'La regla general del particionado',b:`Se particiona por clave cuando el consumidor necesita <b>acumular estado agrupado</b>. Flink lo necesitaba; el detector no.<p>Su único estado es el modelo de Isolation Forest, que es <b>global</b> — un solo modelo entrenado con las primeras 40 muestras de todas las sesiones mezcladas. No hay un modelo por sesión, así que el orden y la partición le son indiferentes.</p>`,
  quiz:{q:'¿Cuándo SÍ harías falta clave en este segundo tópico?',a:'Si quisieras detectar patrones <b>entre ventanas</b> de la misma sesión — por ejemplo «la latencia lleva tres ventanas subiendo». Ahí el consumidor tendría que acumular estado por sesión, y necesitarías <code>session_id</code> como clave para garantizar orden.<p>Es exactamente la limitación de las ventanas amnésicas que el TFM declara como trabajo futuro: requeriría <code>ProcessFunction</code> con estado o <i>session windows</i>.</p>'}}
]},
{n:'Detección',s:'Híbrida',f:sc3,steps:[
 {t:'Dos capas independientes, no una cascada',b:`El detector consume <b>vectores, no eventos</b>. Nunca ve un JSON crudo — por eso puede comparar contra <code>avg_latency_ms</code>, un valor que no existía en el evento original.<p>Las dos capas se evalúan <b>siempre</b>, sin cortocircuito entre ellas. Por eso hay casos detectados por ambas.</p>`},
 {t:'R1 — la firma explícita',b:`<code>device == "bot_scraper"</code>. Determinista, instantánea, explicable. Captura el <b>100 % de los bots</b> en tus datos reales: 3.011 de 3.011.<p>Filtra por «solo regla» en la tabla para ver los tres ejemplos de bot.</p>`},
 {t:'R2 — degradación sostenida, no picos',b:`<code>avg_latency_ms &gt; 2000.0</code> compara el <b>promedio de la ventana</b>. Una sesión con latencias 180, 205, 195, 8000, 170, 190 promedia 1.490 ms y <b>no dispara</b>, pese al pico de 8 segundos.<p>Mira <code>v_19</code> (1.980,40 ms) y <code>v_20</code> (2.010,75 ms): 30 milisegundos separan una alerta de un silencio.</p>`},
 {t:'R3 — la regla huérfana',b:`<code>clicks_count &gt; 35</code>. <b>Nunca se dispara.</b> El generador limita cada sesión a <code>max_events = randint(4, 15)</code>, y el máximo observado en los 13.696 registros es 14.<p>Y no basta con subir el techo: ningún perfil de anomalía modela una <b>ráfaga</b>. Haría falta un cuarto tipo, <i>click flood</i> — está declarado como trabajo futuro.</p>`},
 {t:'Isolation Forest — la forma, no el valor',b:`Filtra por «solo ML». Mira <code>v_07</code> a <code>v_11</code>: dispositivo real, latencia ~120 ms, clics corrientes. <b>Ningún campo aislado es anómalo.</b><p>Lo raro es la geometría: en un embudo sano cada etapa tiene menos eventos que la anterior. Aquí <code>checkout_starts</code> (7) supera a <code>cart_adds</code> (2). El embudo se invierte. Eso no lo expresa ningún umbral.</p>`},
 {t:'Los cuatro veredictos',b:`Recorre la tabla con los filtros. <b>REGLA</b>: firma conocida. <b>SOLO ML</b>: patrón sutil. <b>AMBAS</b>: anomalías severas donde convergen. <b>Sin alerta</b>: pasa las dos capas.<p>Fíjate en <code>v_16</code>, <code>v_17</code> y <code>v_18</code>: sesiones normales que el ML marca igualmente. Con <code>contamination = 0.08</code>, el modelo marca por construcción una fracción de todo lo que ve — son <b>falsos positivos</b>, y conviene reconocerlos.</p>`},
 {t:'Lo que dicen tus datos reales',b:`Reglas 5.886 (43,0 %) · ML exclusivo 7.810 (57,0 %) · solape 686 (5,0 %). Y un hallazgo verificado: <b>Isolation Forest no marcó ni un solo bot</b> — 0 de 3.011.<p>No es que una capa sea mejor. <b>Ninguna puede sustituir a la otra</b>: quitar las reglas dejaría 3.011 bots invisibles; quitar el ML dejaría 7.810 anomalías sin detectar. Eso es H2 y H3.</p>`,
  quiz:{q:'¿Por qué el ML no puede detectar un bot por su campo device?',a:'Porque <code>device</code> <b>no es una de las 6 características</b>. Viaja en la raíz del JSON, fuera de <code>feature_metrics</code>, y el modelo solo recibe el array numérico. Codificarlo (one-hot) sería posible, pero equivaldría a reimplantar R1 disfrazada de característica, sin aportar generalización.'}}
]},
{n:'Docker',s:'Infra',f:sc4,steps:[
 {t:'Tres contenedores en una red privada',b:`Dentro de <code>tfm_network</code> los contenedores se llaman por nombre, no por IP. Pulsa cualquiera para ver su configuración real.`},
 {t:'La frontera de red: dos listeners',b:`Kafka expone dos puertas. Selecciona <b>tfm-kafka</b> en el panel: ahí está la explicación de por qué el productor usa 9094 y el consumidor de consola del README usa 9092.`},
 {t:'Qué corre fuera de Docker',b:`Los cuatro scripts de Python — <b>incluido PyFlink</b> — se ejecutan en la máquina anfitriona. El clúster Flink está desplegado como <b>infraestructura objetivo</b>.<p>Selecciona el bloque de la máquina anfitriona para la frase exacta que conviene decir en la defensa.</p>`},
 {t:'Persistencia y arranque',b:`Los volúmenes hacen que el log sobreviva al reinicio. Y el broker corre en modo <b>KRaft</b>: si alguien pregunta dónde está ZooKeeper, la respuesta es que Kafka lo eliminó desde la versión 3.x.`,
  quiz:{q:'¿Cuántas particiones tienen tus tópicos, y por qué no más?',a:'<b>Una, en los tres.</b> No hay ningún <code>kafka-topics --create</code> en el repositorio ni <code>KAFKA_NUM_PARTITIONS</code> en el compose, así que los tópicos se autocrean con el valor por defecto del broker (<code>num.partitions = 1</code>).<p><b>Por qué no más:</b> con un solo consumidor en una sola máquina, tres particiones no habrían generado paralelismo real — habrían simulado una escala que la infraestructura no tenía. Y con una partición el orden es <b>total</b>, lo que hace los resultados exactamente reproducibles.</p><p><b>El remate:</b> el mecanismo sí está implementado (<code>key=session_id</code>). Escalar es añadir una variable de entorno, sin cambiar una línea de código. Esa es la propiedad que valida el diseño.</p>'}}
]},
{n:'Recorrido',s:'Completo',f:sc5,steps:[
 {t:'Pulsa cada capa y observa cómo cambia la forma',b:`El mismo dato atraviesa cinco capas y en cada una <b>pierde detalle a cambio de significado</b>: de 10 campos con URL e IP, a 6 números, a dos banderas booleanas.`},
 {t:'Kafka aparece tres veces',b:`Faker → <code>ecommerce-events</code> → Flink → <code>retail-feature-vectors</code> → detector → <code>ecommerce-alerts</code> → dashboard.<p>Ningún componente habla directamente con otro. Todos conocen solo un nombre de tópico.</p>`},
 {t:'Dos consumidores, dos propósitos',b:`El dashboard no solo pinta alertas: lee <code>ecommerce-events</code> por su cuenta para construir el grafo de navegación, normalizando cada URL a un nodo del embudo y acumulando aristas ponderadas en SQLite.<p>Por eso el vector puede descartar <code>page_url</code> sin que el grafo pierda nada.</p>`},
 {t:'El límite estructural',b:`Ninguna anomalía puede detectarse antes de que cierre su ventana. Es el precio de los 10 segundos, y es una decisión de diseño defendible: ventanas más cortas dan alertas más rápidas con menos evidencia; más largas, lo contrario.`},
 {t:'La frase de cierre',b:`<i>«Kafka no es un componente del pipeline: es el tejido que lo sostiene. Cada capa consume de un tópico y produce en otro, sin conocer jamás la identidad de sus vecinos.»</i><p>Consulta el cajón <b>Objetivos e hipótesis</b> para repasar qué queda validado, qué es parcial y qué es trabajo futuro.</p>`,
  quiz:{q:'¿Por qué el vector descarta page_url si el TFM analiza grafos de navegación?',a:'Porque son <b>dos ramas paralelas</b>. La rama de detección solo necesita comportamiento numérico. El grafo se construye aparte, en <code>app.py</code>, leyendo directamente <code>ecommerce-events</code> con su propio <code>group_id</code>. Otra ventaja del log inmutable: dos consumidores, dos propósitos, el mismo flujo.'}}
]}];

/* ════════════ RENDER ════════════ */
function render(){
  const S_=SCENES[sc], step=S_.steps[st], out=S_.f(st);
  $('#stage').innerHTML=`<section class="scene live"><div class="sbody">
    <div class="main">${out.main}</div><div class="insp">${out.insp}</div></div></section>`;
  requestAnimationFrame(()=>{
    $$('.scene [data-from]').forEach(n=>{
      const f=+n.dataset.from; if(st>=f) n.classList.add('on');
    });
  });

  $('#sTitle').textContent=step.t;
  $('#sBody').innerHTML=step.b;

  const side=$('#side'); side.innerHTML='';
  const expBloq = (sc===1 && st===6 && parts===1);
  if(expBloq){
    const d=document.createElement('div'); d.className='note';
    d.innerHTML='<b>Experimento no disponible con 1 partición.</b> No hay nada que dispersar: con una sola cinta, quitar la clave no cambia el destino. Cambia a la vista de <b>3 particiones</b> para verlo.';
    side.appendChild(d);
  }
  if(step.exp && !expBloq){
    const b=document.createElement('button');
    b.className='expb'+(EXP[step.exp.k]?' on':'');
    b.textContent=(EXP[step.exp.k]?'↩ '+step.exp.on:'⚡ '+step.exp.off);
    b.onclick=()=>{EXP[step.exp.k]=!EXP[step.exp.k];render();};
    side.appendChild(b);
  }
  if(step.quiz){
    const q=document.createElement('div'); q.className='quiz';
    q.innerHTML=`<p>${step.quiz.q}</p><button>Ver respuesta</button><div class="ans">${step.quiz.a}</div>`;
    q.querySelector('button').onclick=()=>{q.classList.toggle('open');
      q.querySelector('button').textContent=q.classList.contains('open')?'Ocultar':'Ver respuesta';};
    side.appendChild(q);
  }

  $$('.tab').forEach((t,i)=>t.classList.toggle('sel',i===sc));
  $('#dots').innerHTML=S_.steps.map((_,i)=>`<div class="dot ${i===st?'on':(i<st?'past':'')}" data-d="${i}"></div>`).join('');
  $('#pos').textContent=`${st+1} / ${S_.steps.length}`;
  $('#prev').disabled=(sc===0&&st===0);
  $('#next').disabled=(sc===SCENES.length-1&&st===S_.steps.length-1);
  $('#next').textContent=(st===S_.steps.length-1&&sc<SCENES.length-1)?`${SCENES[sc+1].s} →`:'Siguiente →';
}
function go(d){
  st+=d;
  if(st<0){ if(sc>0){sc--;st=SCENES[sc].steps.length-1;} else st=0; }
  if(st>=SCENES[sc].steps.length){ if(sc<SCENES.length-1){sc++;st=0;} else st=SCENES[sc].steps.length-1; }
  render(); $('#stage').scrollIntoView({behavior:'smooth',block:'nearest'});
}

/* ════════════ EVENTOS ════════════ */
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]'); 
  if(a){
    const k=a.dataset.act;
    if(k==='s0') sel[0]=a.dataset.id;
    if(k==='s1') sel[1]=+a.dataset.i;
    if(k==='s2') sel[2]=a.dataset.sid+':'+a.dataset.i;
    if(k==='s3') sel[3]=a.dataset.id;
    if(k==='s4') sel[4]=a.dataset.k;
    if(k==='s5') sel[5]=+a.dataset.i;
    if(k==='s6') sel[6]=+a.dataset.i;
    if(k==='filt') filt=a.dataset.k;
    if(k==='parts'){ parts=+a.dataset.n; sel[1]=null; if(parts===1) EXP.nokey=false; }
    render(); return;
  }
  const d=e.target.closest('.dot'); if(d){ st=+d.dataset.d; render(); return; }
  if(e.target.matches('[data-close]')) closeAll();
});
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')go(1); if(e.key==='ArrowLeft')go(-1); if(e.key==='Escape')closeAll();
});

/* ════════════ INIT ════════════ */
$('#tabs').innerHTML=SCENES.map((s,i)=>`<button class="tab" data-i="${i}"><b>${i+1}</b>${s.s}</button>`).join('');
$$('.tab').forEach(t=>t.onclick=()=>{sc=+t.dataset.i;st=0;render();});
$('#prev').onclick=()=>go(-1);
$('#next').onclick=()=>go(1);

$('#gloBody').innerHTML='<table>'+GLO.map(g=>
  `<tr class="${g[3]||''}"><td>${g[0]}${g[1]?`<em>${g[1]}</em>`:''}</td><td>${g[2]}</td></tr>`).join('')+'</table>';

$('#objBody').innerHTML=OBJ.map(o=>{
  if(o.h) return `<div class="oh">${o.h}</div>`;
  return `<div class="oi"><div class="ot">${o.t}<span class="badge b-${o.b}">${o.bl}</span></div>
    <div class="od">${o.d}</div><div class="on ${o.b}">${o.n}</div></div>`;
}).join('')+'<div style="padding:14px 17px;font-size:11px;color:var(--faint);line-height:1.6">Los estados reflejan lo verificado contra el código y el CSV <code>FINAL_historical_alerts.csv</code> (13.696 registros). Las cifras marcadas como reales son trazables; los 20 vectores de la escena 4 son ilustrativos.</div>';

function closeAll(){$$('.drw').forEach(d=>d.classList.remove('open'));$('#scrim').classList.remove('open');}
function open(id){closeAll();$(id).classList.add('open');$('#scrim').classList.add('open');}
$('#gloBtn').onclick=()=>open('#drwGlo');
$('#objBtn').onclick=()=>open('#drwObj');
$('#scrim').onclick=closeAll;

render();

</script>
