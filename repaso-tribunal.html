<script>
const Q = [
{
 t:"Arquitectura Lambda y Flink", topic:"Arquitectura",
 q:"Su trabajo dice que Flink permite eliminar la arquitectura Lambda. ¿Qué problema tiene Lambda y por qué con Flink ya no hace falta?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>La arquitectura Lambda mantiene dos flujos en paralelo: una capa de velocidad en streaming, rápida pero aproximada, y una capa batch, lenta pero exacta, más una capa de servicio que combina ambos resultados. El problema es que la misma lógica se programa y se mantiene dos veces, y los dos resultados pueden no coincidir.</p>
<p>Flink elimina esa necesidad porque trata el batch como un caso particular del streaming: un flujo con inicio y fin. Y como ofrece estado gestionado, event time y exactly-once, el propio flujo en streaming puede dar resultados exactos. Con un solo motor y un solo código se cubre lo que Lambda repartía en dos capas.</p>
<p>En nuestro prototipo trabajamos solo en streaming. Usamos el estado gestionado, en los acumuladores del reduce por sesión, pero no ejercimos event time ni exactly-once. Es una limitación declarada.</p></div>
<h3>Las tres capacidades, en una línea cada una</h3>
<pre>ESTADO GESTIONADO  Flink guarda, por cada clave, lo que va acumulando.
                   → Lo usamos: acumuladores del reduce por session_id.
EVENT TIME         Agrupa por el momento en que ocurrió el evento.
                   → No lo usamos: trabajamos con processing time.
EXACTLY-ONCE       Tras una caída, cada evento se refleja una sola vez:
                   ni se pierde ni se duplica.
                   → No lo usamos: no hay checkpointing.</pre>
<h3>Réplica probable: ¿por qué no usaron event time ni exactly-once?</h3>
<div class="say"><p>Fue una decisión de alcance: el objetivo era validar la detección, no la tolerancia a fallos. En nuestro entorno, event time aportaba poco, porque producer, Kafka y Flink corren en la misma máquina y el retraso es de milisegundos; en cambio, añade latencia, porque cada ventana espera la tolerancia de la watermark. Exactly-once tampoco cambiaba los resultados con datos sintéticos y también añade latencia, porque los vectores solo se publican al confirmarse cada checkpoint. No fue una limitación de recursos: el estado de nuestras ventanas ocupa unos pocos kilobytes.</p></div>
<div class="careful"><strong>Cuida esto.</strong> Lambda tiene tres capas: batch, speed y serving. Flink permite batch, pero nuestro trabajo es solo streaming. No uses "falta de memoria o disco" como justificación: el docker-compose no tiene límites y el estado es diminuto.</div>`
},
{
 t:"Kafka coloca, Flink agrupa", topic:"Kafka · Flink",
 q:"Los eventos pasan primero por Kafka y luego por Flink. Explique la función de cada uno. ¿Quién agrupa los eventos de una misma sesión y cómo lo hace?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Kafka coloca y Flink agrupa.</p>
<p>Kafka recibe los eventos del producer en el tópico <code>ecommerce-events</code>, los almacena en un log persistente y los sirve a quien los consuma. Desacopla al productor de los consumidores: Flink y el dashboard leen el mismo tópico de forma independiente, cada uno con su propio group_id. Kafka no agrupa ni procesa nada.</p>
<p>El producer envía cada evento con session_id como clave. Con una sola partición, todo va al mismo log; con varias, el hash de la clave garantiza que los eventos de una sesión caigan siempre en la misma partición, y por tanto se conserva su orden de llegada.</p>
<p>Flink es quien agrupa: con key_by por session_id y ventanas de 10 segundos, acumula en el reduce los eventos de cada sesión, y al cerrar la ventana emite un vector por cada sesión activa hacia <code>retail-feature-vectors</code>.</p></div>
<h3>Puntos clave</h3>
<ul class="pts">
<li>Kafka garantiza el orden de <span class="hl">llegada al broker dentro de una partición</span>, no el orden de generación.</li>
<li>Flink agrupa <span class="hl">eventos</span>; el vector es el resultado que emite al cerrar la ventana.</li>
<li>La clave de Kafka y el key_by de Flink son cosas distintas: Flink redistribuye por session_id aunque haya varias particiones.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> El tópico es <code>ecommerce-events</code>, con guion. Nunca digas "Kafka agrupa".</div>`
},
{
 t:"session_id vs group_id", topic:"Kafka",
 q:"En su código aparecen dos identificadores que se pueden confundir: session_id y group_id. ¿Qué es cada uno, dónde se usa y qué papel cumple?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>session_id identifica al dato: es el identificador de cada sesión de usuario, que genera el producer. Se usa dos veces: como clave del mensaje en Kafka, para que los eventos de una sesión vayan a la misma partición y conserven su orden, y en el key_by de Flink, para agrupar esos eventos en ventanas de 10 segundos y emitir un vector por sesión.</p>
<p>group_id identifica a un grupo de consumidores. Kafka guarda, por cada grupo, el offset hasta el que ha confirmado su lectura en cada partición, para que pueda retomar desde ahí. Cada grupo lee el tópico completo de forma independiente: por eso Flink y el dashboard leen ecommerce-events, cada uno con su propio group_id, sin quitarse eventos entre sí.</p>
<p>En nuestro caso, Flink arranca siempre con latest(), así que ignora el offset guardado de su grupo: al relanzarlo, no retoma desde donde se quedó.</p></div>
<h3>Para recordarlo</h3>
<pre>session_id → DE QUIÉN es el dato   (el cliente que navega)
group_id   → QUIÉN lo está leyendo (el lector con su marcapáginas)</pre>
<h3>Consumidores en el código</h3>
<div class="tbl"><table>
<tr><th>Consumidor</th><th>Tópico</th><th>group_id</th></tr>
<tr><td>Flink</td><td>ecommerce-events</td><td><code>tfm-analytics-group-prod</code></td></tr>
<tr><td>Detector</td><td>retail-feature-vectors</td><td><code>tfm-ml-detector-group</code></td></tr>
<tr><td>Dashboard (alertas)</td><td>ecommerce-alerts</td><td><code>tfm-dashboard-viewer-group</code></td></tr>
<tr><td>Dashboard (grafo)</td><td>ecommerce-events</td><td><code>tfm-dashboard-graph-group</code></td></tr>
</table></div>
<div class="careful"><strong>Cuida esto.</strong> Kafka no sabe "qué evento" leíste: guarda un offset, una posición. El group_id por sí solo no asegura leer todos los eventos.</div>`
},
{
 t:"¿Y sin key_by?", topic:"Flink",
 q:"Si eliminamos el key_by(session_id) y aplicamos la ventana de 10 segundos sobre todo el flujo, ¿qué pasaría con el vector y con la detección?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Sin key_by, la ventana sería global: un solo vector cada 10 segundos con todos los eventos de todas las sesiones mezclados, unos 300 a nuestro ritmo de 30 eventos por segundo.</p>
<p>Los estadísticos seguirían siendo correctos, pero cambiaría la unidad de análisis: dejarían de describir una sesión y pasarían a describir el tráfico total. R3 dispararía en todas las ventanas, porque habría cientos de eventos, y R2 casi nunca, porque la latencia alta de una sesión se diluiría en el promedio. Además, los campos de identidad del vector serían los del primer evento de la ventana, así que R1 dependería del azar y ninguna alerta señalaría a una sesión concreta.</p>
<p>Seguiríamos detectando anomalías de la plataforma, pero perderíamos lo que busca el trabajo: saber qué sesión se comporta de forma anómala. Por eso key_by por session_id es la decisión central del diseño.</p></div>
<h3>Ejemplo de dilución de R2</h3>
<pre>5 eventos de 5.000 ms + 295 eventos de ~120 ms
Promedio ≈ (5×5.000 + 295×120) / 300 ≈ 200 ms  → R2 no dispara</pre>
<div class="careful"><strong>Cuida esto.</strong> No digas "sería cualquier cosa" ni "estadísticos incoherentes". Di "cambia la unidad de análisis". El warmup de 40 vectores tardaría unos 400 segundos.</div>`
},
{
 t:"Las tres reglas heurísticas", topic:"Detector · reglas",
 q:"Su capa heurística tiene tres reglas. Enúncielas con su condición exacta y diga cuántas alertas generó cada una según el CSV final.",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>La capa heurística tiene tres reglas, que se evalúan en orden y se detienen en la primera que se cumple.</p>
<p>CRITICAL_RULE: device igual a bot_scraper. Generó 3.011 alertas. PERFORMANCE_RULE: latencia promedio de la ventana mayor a 2.000 ms. Generó 2.875. SECURITY_RULE: más de 35 eventos en una ventana de 10 segundos. No generó ninguna.</p>
<p>En total, 5.886 alertas por reglas, de las cuales 686 también fueron marcadas por Isolation Forest; 5.200 son exclusivas de las reglas.</p></div>
<div class="tbl"><table>
<tr><th>Regla</th><th>Condición</th><th class="num">Alertas</th></tr>
<tr><td><code>CRITICAL_RULE</code></td><td>device == "bot_scraper"</td><td class="num">3.011</td></tr>
<tr><td><code>PERFORMANCE_RULE</code></td><td>avg_latency_ms &gt; 2000</td><td class="num">2.875</td></tr>
<tr><td><code>SECURITY_RULE</code></td><td>clicks_count &gt; 35</td><td class="num">0</td></tr>
<tr class="total"><td>Total</td><td></td><td class="num">5.886</td></tr>
</table></div>
<div class="careful"><strong>Cuida esto.</strong> El umbral de R3 es <strong>35</strong>. R2 compara el promedio de la ventana, no cada evento. Di "alertas", no "anomalías".</div>`
},
{
 t:"Por qué R3 nunca disparó", topic:"Detector · reglas",
 q:"La regla SECURITY_RULE nunca disparó: cero alertas en 13.696. ¿Por qué? ¿Es un error del código, del generador o del diseño? ¿Qué harían con ella?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>No disparó porque el generador limita cada sesión a un máximo de 15 eventos, y el máximo observado fue 14; nunca se llega a 35.</p>
<p>No es un error de código: la regla funciona. Es una inconsistencia de diseño: ninguno de nuestros tipos de anomalía simula una ráfaga de peticiones, que es lo que esta regla vigila.</p>
<p>La solución es añadir al generador una anomalía de ráfaga, con más de 35 eventos en 10 segundos, para validarla. No bajaríamos el umbral, porque dispararía sobre sesiones normales largas. La mantenemos en el diseño porque cubre un escenario real de producción.</p></div>
<pre>max_events = random.randint(4, 15)   ← faker_producer.py
Techo teórico: 15   ·   Máximo observado en el CSV: 14</pre>
<div class="careful"><strong>Cuida esto.</strong> No lo atribuyas a la capacidad de la infraestructura: con más tráfico habría más sesiones, no sesiones más largas.</div>`
},
{
 t:"F1 = 1,000: cálculo y lectura", topic:"Evaluación",
 q:"Reportan un F1 de 1,000 para el sistema híbrido. Un F1 perfecto es muy raro en detección de anomalías. ¿Cómo se calculó ese valor y por qué debemos creerlo?",
 a:`<h3>De dónde salen las alertas</h3>
<div class="tbl"><table>
<tr><th>Origen de la alerta</th><th class="num">Alertas</th><th class="num">% del total</th></tr>
<tr><td>Solo reglas heurísticas</td><td class="num">5.200</td><td class="num">38,0 %</td></tr>
<tr><td>Solo Isolation Forest</td><td class="num">7.810</td><td class="num">57,0 %</td></tr>
<tr><td>Ambas capas a la vez</td><td class="num">686</td><td class="num">5,0 %</td></tr>
<tr class="total"><td>Total de alertas (universo)</td><td class="num">13.696</td><td class="num">100 %</td></tr>
</table></div>
<pre>Total reglas           = 5.200 + 686 = 5.886   (R1 3.011 + R2 2.875 + R3 0)
Total Isolation Forest = 7.810 + 686 = 8.496</pre>
<h3>Fórmulas y supuesto del trabajo</h3>
<pre>Universo = las 13.696 alertas. Se asume que TODAS son anomalías reales.

VP = alertas que esa capa SÍ generó
FP = 0   → se asume que ninguna alerta es errónea
FN = alertas del universo que esa capa NO generó

Precisión = VP / (VP + FP)
Recall    = VP / (VP + FN)
F1        = 2 × Precisión × Recall / (Precisión + Recall)</pre>
<h3>Cálculo por capa</h3>
<div class="tbl"><table>
<tr><th></th><th>Solo reglas</th><th>Solo Isolation Forest</th><th>Híbrido</th></tr>
<tr><td>VP</td><td>5.886</td><td>8.496</td><td>13.696</td></tr>
<tr><td>FP</td><td>0</td><td>0</td><td>0</td></tr>
<tr><td>FN</td><td>13.696 − 5.886 = <b>7.810</b></td><td>13.696 − 8.496 = <b>5.200</b></td><td><b>0</b></td></tr>
<tr><td>Precisión</td><td>5.886 / 5.886 = <b>1,000</b></td><td>8.496 / 8.496 = <b>1,000</b></td><td>13.696 / 13.696 = <b>1,000</b></td></tr>
<tr><td>Recall</td><td>5.886 / 13.696 = <b>0,430</b></td><td>8.496 / 13.696 = <b>0,620</b></td><td>13.696 / 13.696 = <b>1,000</b></td></tr>
<tr><td>F1</td><td>2×1×0,430 / 1,430 = <span class="hl">0,601</span></td><td>2×1×0,620 / 1,620 = <span class="hl">0,766</span></td><td>2×1×1 / 2 = <span class="hl">1,000</span></td></tr>
</table></div>
<h3>Cómo leerlo</h3>
<ul class="pts">
<li>La precisión es 1,000 en las tres columnas <b>por construcción</b>. No distingue entre capas.</li>
<li>Toda la diferencia está en el recall, que solo mide qué parte de las alertas totales aporta cada capa.</li>
<li>Lo defendible: las capas se solapan solo en un 5 %. Son complementarias.</li>
<li>Lo no defendible: afirmar que el híbrido detecta un 40 % mejor, o que no tiene falsos positivos.</li>
</ul>
<h3>Para decir en voz alta</h3>
<div class="say"><p>El F1 de 1,000 es circular y así lo declaramos. Definimos el universo de evaluación como el conjunto de alertas emitidas, y el CSV solo registra alertas. Por eso no podemos contar falsos positivos, porque no tenemos la etiqueta real de cada ventana, ni falsos negativos, porque las ventanas sin alerta no se guardaron. Con esa definición, la precisión es 1 por construcción para cualquier capa.</p>
<p>Lo defendible es la comparación entre capas: las reglas y el modelo solo coinciden en el 5 % de las alertas, y el modelo aporta 7.810 alertas que las reglas no generan. Las capas son complementarias.</p>
<p>La etiqueta real existe: el generador marca cada evento con su tipo de anomalía. Propagarla hasta el vector y registrar todas las ventanas nos permitiría calcular precisión y recall reales. Es la primera mejora pendiente.</p></div>
<div class="careful"><strong>Cuida esto.</strong> No digas "el híbrido tiene mejor precisión": todas valen 1,000. El CSV son alertas, no anomalías verificadas. El F1 de 0,766 de Isolation Forest es un cálculo propio con el mismo método; úsalo solo si aparece en la memoria o te lo preguntan.</div>`
},
{
 t:"Processing time vs event time", topic:"Flink · tiempo",
 q:"Su procesador Flink usa ventanas de processing time. ¿Qué significa y en qué se diferencia de event time? Explíquelo con un ejemplo concreto de su pipeline.",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Processing time significa que Flink asigna cada evento a una ventana según el reloj de la máquina en el momento en que el evento llega. Event time significa asignarlo según el momento en que ocurrió, que en nuestro caso es el timestamp que el producer escribe en cada evento.</p>
<p>Por ejemplo: un evento se genera en el segundo 9,5, pero por un retraso llega a Flink en el segundo 10,3. Como nuestra ventana es de processing time, Flink lo asigna a la ventana de 10 a 20 segundos e ignora su timestamp. Con event time iría a la ventana de 0 a 10, que es donde ocurrió.</p>
<p>La consecuencia es que, con processing time, el contenido de cada ventana depende de los retrasos del transporte y el resultado no es reproducible. En nuestro entorno local el retraso es de milisegundos, así que la diferencia práctica es mínima, pero es una limitación declarada.</p></div>
<pre>Evento creado en 9,8 s · llega a Flink en 10,3 s

PROCESSING TIME  reloj de la máquina: 10,3 → ventana [10, 20)
EVENT TIME       timestamp del evento: 9,8 → ventana [0, 10)</pre>
<h3>Watermarks</h3>
<ul class="pts">
<li>Una watermark es una marca de progreso del tiempo del evento: "ya no espero eventos anteriores a W".</li>
<li>Se calcula con una tolerancia: W = timestamp más alto visto − tolerancia.</li>
<li>Solo intervienen en event time. Con processing time la ventana se cierra por el reloj de la máquina.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> La causa es el tipo de ventana (<code>TumblingProcessingTimeWindows</code>), no <code>no_watermarks()</code>. Se pronuncia "uóter-marks".</div>`
},
{
 t:"Garantía de entrega", topic:"Tolerancia a fallos",
 q:"¿Qué garantía de entrega ofrece su pipeline tal como está implementado? Justifíquelo con el código y explique qué ocurre si Flink se cae y se vuelve a lanzar.",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Nuestro pipeline es at-most-once: cada evento se procesa como máximo una vez, y algunos pueden perderse.</p>
<p>Hay tres razones en el código. No habilitamos checkpointing, el source de Kafka arranca siempre con latest(), es decir, desde el final del tópico, y el sink no tiene una garantía de entrega configurada.</p>
<p>Si Flink se cae, se pierden dos cosas. Primero, los acumuladores de las ventanas abiertas, que viven en memoria, así que esos vectores nunca se emiten. Segundo, al relanzarlo, empieza por los eventos nuevos, y los que llegaron a Kafka durante la caída no se procesan. Además, el job no se reinicia solo: hay que relanzarlo manualmente.</p>
<p>Es una limitación declarada. Con datos sintéticos no altera las conclusiones, y la arquitectura lo soporta.</p></div>
<h3>Evidencia en el código</h3>
<pre>Sin env.enable_checkpointing(...)
.set_starting_offsets(KafkaOffsetsInitializer.latest())
KafkaSink sin .set_delivery_guarantee(...)</pre>
<h3>Pronunciación</h3>
<pre>at-most-once   → "at MÓUST uáns"    como máximo una vez
at-least-once  → "at LÍST uáns"     al menos una vez
exactly-once   → "eg-SÁKT-li uáns"  exactamente una vez</pre>
<div class="careful"><strong>Cuida esto.</strong> Dilo con seguridad, sin disculparte. Con latest() también se pierden los eventos que el producer emite antes de que Flink termine de arrancar.</div>`
},
{
 t:"Hacia event time y exactly-once", topic:"Producción",
 q:"Si mañana tuvieran que llevar este pipeline a producción, ¿qué cambiarían en Flink para trabajar con event time y exactly-once? Explíquelo a nivel de diseño.",
 a:`<h3>Qué significa "a nivel de diseño"</h3>
<p>Qué piezas del pipeline cambian y por qué, sin sintaxis de código.</p>
<h3>Cambios</h3>
<pre>EVENT TIME (3 cambios)
1. Conservar el timestamp del evento. Hoy el map de Flink lo descarta.
2. Reemplazar no_watermarks() por watermarks con tolerancia (p. ej. 2 s).
3. Cambiar la ventana de processing time por una de event time.

EXACTLY-ONCE (4 cambios)
1. Habilitar checkpointing, guardado en disco y no en memoria.
2. Source: retomar desde los offsets confirmados en lugar de latest().
3. Sink: entrega transaccional exactly-once hacia Kafka.
4. Detector: leer solo mensajes confirmados (read_committed).

COSTOS
- Más latencia: tolerancia de la watermark y confirmación del checkpoint.
- Alcance: la garantía llega hasta retail-feature-vectors; el detector
  necesitaría alertas idempotentes para cubrir el extremo a extremo.</pre>
<h3>Para decir en voz alta</h3>
<div class="say"><p>Para event time haría tres cambios: conservar en el flujo el timestamp que genera el producer, que hoy se descarta; sustituir no_watermarks por una estrategia de watermarks con una tolerancia, por ejemplo de dos segundos, para esperar eventos que lleguen con retraso; y cambiar la ventana a event time. Así cada evento cae en la ventana en la que ocurrió y los resultados son reproducibles.</p>
<p>Para exactly-once haría cuatro: habilitar checkpointing con almacenamiento en disco, que el source retome desde los offsets confirmados en lugar de leer desde el final, configurar el sink de Kafka en modo transaccional exactly-once, y que el detector lea solo mensajes confirmados. Así, tras una caída, cada evento se refleja una sola vez: ni se pierde ni se duplica.</p>
<p>El costo es latencia, y la garantía llegaría hasta el tópico de vectores; para cubrir las alertas habría que hacer idempotente el detector. Son cambios de configuración, no de arquitectura.</p></div>
<div class="careful"><strong>Cuida esto.</strong> Exactly-once no es "leer todos los eventos" (eso es at-least-once): es ni perder ni duplicar. Di que los resultados serían "correctos y reproducibles", no "más reales".</div>`
},
{
 t:"Isolation Forest y los bots", topic:"Detector · modelo",
 q:"Isolation Forest no marcó como anómalo ninguno de los 3.011 vectores de bots. Solo los detectó CRITICAL_RULE. ¿Por qué el modelo no los vio? ¿Es un fallo del algoritmo o de su diseño?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Es un fallo de diseño, no del algoritmo. El modelo solo recibe las seis métricas numéricas; el campo device, que usa la regla, viaja en el mensaje pero no entra al vector del modelo.</p>
<p>Aun así, los bots tienen una firma numérica clara: unos 10 ms de latencia frente a unos 120 de una sesión normal. El problema está en el warmup: 40 vectores sin filtrar. Isolation Forest solo corta entre el mínimo y el máximo de lo que vio al entrenar. Si en el warmup no hubo bots, no hay cortes por debajo de la sesión normal más rápida, y el bot sigue su mismo camino en el árbol. Además, lo más probable es que entraran vectores de alta latencia, que estiraron el rango hasta 8.000 ms y concentraron los cortes en la zona alta. Por eso el modelo detecta la latencia alta, pero no la baja.</p>
<p>Lo mejoraríamos con un warmup más grande y filtrado por las reglas; como complemento, logaritmo de la latencia y características de navegación. Y justifica el enfoque híbrido: la regla cubre lo que el modelo no ve.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th>Decisión de diseño</th><th>Efecto</th></tr>
<tr><td><code>device</code> fuera del vector</td><td>El modelo no ve la etiqueta bot_scraper</td></tr>
<tr><td>Warmup sin filtrar (40)</td><td>Sin bots: no hay cortes en la zona baja. Con alta latencia: rango estirado</td></tr>
<tr><td>Latencia sin transformar</td><td>Rango 1–8.000 ms: casi ningún corte cae en 1–20 ms</td></tr>
</table></div>
<ul class="pts">
<li>Isolation Forest no mide distancias: mide cuántos cortes hacen falta para <span class="hl">aislar</span> un punto. Un valor por debajo del mínimo del warmup sigue el camino del punto más bajo.</li>
<li>Evidencia: las 686 alertas de ambas capas tienen latencia media de ~5.055 ms. El modelo detecta el extremo alto, nunca el bajo.</li>
<li>Logaritmo (ilustrativo, nodo raíz): lineal, la franja 1–20 ms es 19/8.000 ≈ 0,2 % del rango; en log10, 1,3/3,9 ≈ 33 %.</li>
<li>Con warmup filtrado, el logaritmo pasa a ser opcional. A los bots seguiría sin aislarlos, pero ya los captura R1; el modelo se concentra en lo que las reglas no describen.</li>
<li>Normalizar (min-max, z-score) no cambia nada en Isolation Forest: es lineal y el modelo corta cada métrica en su propio rango. El logaritmo sí, porque no es lineal.</li>
<li>Navegación: % de transiciones fuera de ARISTAS_ESPERADAS, páginas distintas / eventos, tiempo entre eventos. Lleva la lógica del grafo, hoy solo visual, al modelo.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Arranca por <code>device</code>. Las etiquetas is_anomaly / anomaly_type no tienen nada que ver aquí. Di "estiró el rango" y "no quedó aislado", no "distorsionó" ni "no fue filtrado". No afirmes qué vectores entraron en el warmup: no se guardó. No digas "prueba que el híbrido da mejores resultados": di "las capas se complementan".</div>`
},
{
 t:"Flink frente a Spark", topic:"Motor de streaming",
 q:"En su trabajo eligieron Apache Flink frente a Spark Structured Streaming. ¿Cuál es la diferencia de fondo entre los dos motores y por qué Flink encaja mejor en su caso?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Spark nació batch: trata el streaming como una sucesión de micro-lotes, cada uno procesado como un trabajo batch. Flink nació streaming: trata el batch como un caso particular, un flujo acotado con inicio y fin. Hoy ambos tienen event time, watermarks y exactly-once.</p>
<p>Elegimos Flink por tres razones. Su estado nativo por clave: el acumulador de cada sesión se actualiza con cada evento, no por lote. Un solo motor de streaming, sin capa batch, coherente con eliminar la arquitectura Lambda. Y margen de evolución: las limitaciones del prototipo se resuelven activando capacidades del mismo motor, y si quisiéramos alertar evento a evento, sin esperar el cierre de la ventana, Flink lo permite de forma nativa.</p>
<p>Con ventanas de 10 segundos, la latencia no es lo decisivo; lo decisivo es el estado por sesión.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th>Aspecto</th><th>Spark Structured Streaming</th><th>Flink</th></tr>
<tr><td>Origen</td><td>Batch; añadió streaming</td><td>Streaming; batch = flujo acotado</td></tr>
<tr><td>Ejecución</td><td>Micro-lotes</td><td>Evento a evento</td></tr>
<tr><td>Estado</td><td>Por lote</td><td>Nativo por clave, con cada evento</td></tr>
<tr><td>Event time · watermarks · exactly-once</td><td>Sí</td><td>Sí</td></tr>
</table></div>
<h3>Margen de evolución en su pipeline</h3>
<div class="tbl"><table>
<tr><th>Hoy</th><th>Cambio en Flink</th></tr>
<tr><td>Processing time</td><td>Ventanas de event time + WatermarkStrategy</td></tr>
<tr><td>Sin checkpointing</td><td><code>enable_checkpointing(...)</code></td></tr>
<tr><td>Sink sin garantía</td><td><code>set_delivery_guarantee(EXACTLY_ONCE)</code></td></tr>
<tr><td>Ventana fija de 10 s</td><td>Alertas por evento con temporizadores</td></tr>
</table></div>
<ul class="pts">
<li>Flujo acotado (batch) ≠ ventana. La ventana es un corte temporal de un flujo no acotado. El pipeline usa ventanas y no hace batch.</li>
<li>Referencia: Carbone et al. (2015).</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Spark trata el streaming como micro-lotes, no al revés. No justifiques con "el título dice stream processing": Spark también hace streaming. Di "estado nativo por clave", no "gestor de estado". No digas que Spark no tiene event time, checkpoints o exactly-once. Tabla 5: P99 ~20 ms es cita de Carbone, no medición propia; Gelly no se usa (el grafo va con NetworkX). Di "watermarks".</div>`
},
{
 t:"PyFlink embebido y clúster ocioso", topic:"Despliegue",
 q:"En su docker-compose levantan un JobManager y un TaskManager de Flink, pero el procesador se ejecuta con PyFlink desde el propio host. ¿Dónde corre realmente su job de Flink? ¿Qué papel cumplen esos dos contenedores?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>El job corre en el host. Al ejecutar el script, el proceso Python lanza una JVM y, dentro de ella, un MiniCluster con un JobManager y un TaskManager reales, con paralelismo 1. No es una simulación: es Flink completo en un solo proceso.</p>
<p>Los contenedores de Flink están operativos pero ociosos, preparados para el modo clúster. Lo hicimos así porque simplificó la depuración y porque la imagen oficial de Flink no trae Python; usar el clúster exigía construir una imagen propia.</p>
<p>Desde el host, el job se conecta a Kafka por localhost:9094. Si corriera en el clúster, se conectaría por kafka:9092. Lo declaramos en 5.2.2, y la prospectiva en 8.2 propone empaquetar Python en la imagen.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th></th><th>Embebido (real)</th><th>Clúster (preparado)</th></tr>
<tr><td>Dónde corre</td><td>JVM lanzada por Python en el host</td><td>flink-jobmanager + flink-taskmanager</td></tr>
<tr><td>Kafka</td><td>localhost:9094 (EXTERNAL)</td><td>kafka:9092 (INTERNAL)</td></tr>
<tr><td>UI 8081</td><td>Carga, 2 slots libres, 0 jobs</td><td>Mostraría el job</td></tr>
</table></div>
<ul class="pts">
<li>Depurar = probar y corregir durante el desarrollo. Embebido, los vectores del <code>print</code> y los errores salen en la misma terminal; en clúster, en los logs del contenedor del TaskManager.</li>
<li>UI 8081 = interfaz web de Flink, la sirve el JobManager. La memoria (tras la Tabla 8) dice que muestra pipeline, throughput y checkpoints: no ocurre, y sin checkpointing esa vista estaría vacía incluso en clúster.</li>
<li>Kafka sí corre en contenedor; el host lo alcanza porque el 9094 está publicado.</li>
<li>La figura "slot 1 / slot 2" sale del TaskManager ocioso. Ejecución real: un slot.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> El MiniCluster se crea dentro de la JVM, no al revés. No digas "PyFlink simula Flink". No justifiques con "más ligero": no se midió. El 9092 es de Kafka, no de Flink, y el job "se conecta a Kafka", no al revés. No digas "el 8081 no funciona". Confirmar con Benjamín las razones del modo embebido.</div>`
},
{
 t:"Una partición y escalabilidad", topic:"Kafka · escala",
 q:"Sus tópicos de Kafka tienen una sola partición. ¿Qué implica eso para el paralelismo y la escalabilidad del pipeline? Si mañana el tráfico se multiplicara por cien, ¿qué cambiarían?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Con una partición solo hay un lector activo por grupo de consumidores: aunque subamos el paralelismo de Flink, solo una subtarea lee; las demás quedan ociosas. Además, un solo broker sin réplica: si cae, se detiene el pipeline.</p>
<p>Si el tráfico se multiplicara por cien, unos 3.000 eventos por segundo, Kafka no sería el primer cuello de botella. Lo serían Flink con paralelismo 1 y el detector en Python, que procesa un vector a la vez y escribe en CSV y SQLite por cada alerta.</p>
<p>Cambiaríamos tres capas. En Kafka, varias particiones definidas desde el inicio y tres brokers con réplica: las particiones dan paralelismo; la réplica, disponibilidad. En Flink, paralelismo igual al número de particiones, en clúster. En el detector, varias instancias en el mismo grupo, con un modelo entrenado de forma centralizada.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th>Capa</th><th>Hoy</th><th>Tráfico ×100</th></tr>
<tr><td>Kafka</td><td>1 broker, RF 1, 1 partición</td><td>N particiones, 3 brokers, RF 3</td></tr>
<tr><td>Flink</td><td>Paralelismo 1, embebido</td><td>Paralelismo = N, clúster</td></tr>
<tr><td>Detector</td><td>1 proceso, escribe por alerta</td><td>N instancias, modelo compartido</td></tr>
</table></div>
<ul class="pts">
<li>Particiones y lectores van juntos. 3 particiones con 1 lector = mismo rendimiento: un hilo recorre las tres. Solo queda preparado para escalar.</li>
<li>El reparto ocurre solo dentro del mismo grupo. Grupos distintos leen el tópico completo (Flink y dashboard sobre ecommerce-events). Flink y el detector leen tópicos distintos: no se reparten nada.</li>
<li>En Flink no se lanza otro job: se sube el paralelismo del mismo job (<code>env.set_parallelism</code>, hoy 1). Necesita slots: el TaskManager del compose tiene 2.</li>
<li>A 30 eventos/s una subtarea sobra. La ventana no limita la capacidad: solo define cuándo se emite.</li>
<li>Broker = servidor de Kafka. Réplica = líder + seguidoras en otros brokers: disponibilidad, no velocidad. Con RF 1, acks=all equivale a acks=1.</li>
<li>Aumentar particiones después cambia hash(session_id) mod N y rompe el orden por sesión.</li>
</ul>
<pre>Diagnóstico → 1 partición = 1 lector por grupo; cuello: Flink y detector
Kafka      → particiones desde el inicio + 3 brokers con réplica
Flink      → paralelismo = particiones
Detector   → instancias en el mismo grupo, modelo centralizado</pre>
<div class="careful"><strong>Cuida esto.</strong> No digas "leen uno a la vez": solo uno lee. No digas que más particiones "aceleran" por sí solas. Di "throughput" (zrú-put) o "capacidad de procesamiento", "broker" (no "server"), "paralelismo del job" (no "job number"). No digas que Kafka es el cuello de botella a 3.000 eventos/s.</div>`
},
{
 t:"El ground truth que no se usó", topic:"Evaluación · riesgo",
 q:"En 5.3.1 dicen que el generador marca cada evento con is_anomaly y anomaly_type, y que sirven de ground truth para la evaluación de 5.8. Pero 5.8 calcula las métricas solo sobre las alertas del CSV. Y en 8.1 afirman que el híbrido 'recupera la totalidad de las anomalías inyectadas'. ¿Por qué no lo usaron? ¿Se sostiene esa afirmación?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>La observación es correcta; es una limitación de la evaluación. Tiene dos causas: Flink no propaga las etiquetas en el vector, así que no llegan al detector; y el CSV solo guarda las alertas emitidas, no todos los vectores. Sin eso, no podemos contar falsos positivos ni falsos negativos.</p>
<p>Por eso evaluamos sobre el universo de alertas: la precisión es 1 en todas las capas y el recall del híbrido es 1, por construcción. Y la frase de 8.1 debe leerse como la totalidad de las alertas emitidas, no de las anomalías inyectadas.</p>
<p>Lo que sí observamos es que ninguna capa por sí sola cubre todas las alertas: el 95 % las marcó una sola capa. Eso indica que se complementan.</p>
<p>La mejora: llevar las etiquetas en el mensaje de Flink, solo para evaluar, y guardar todos los vectores para calcular la matriz de confusión real por tipo de anomalía.</p></div>
<h3>Las 4 piezas</h3>
<pre>1. Reconozco     → limitación de la evaluación
2. Causa         → Flink no propaga etiquetas + CSV solo guarda alertas
3. Consecuencia  → 5.8 mide cobertura; 8.1 = "alertas emitidas"
4. Corrección    → etiquetas en el mensaje + todos los vectores
                   + matriz de confusión</pre>
<h3>Alerta frente a anomalía</h3>
<div class="tbl"><table>
<tr><th></th><th>Es anomalía</th><th>No es anomalía</th></tr>
<tr><td>Hay alerta</td><td>VP</td><td>FP</td></tr>
<tr><td>No hay alerta</td><td>FN</td><td>VN</td></tr>
</table></div>
<ul class="pts">
<li>El CSV solo tiene la fila "hay alerta", sin poder separar VP de FP. La fila de abajo no se guardó.</li>
<li>El registro se decide en <code>if rule_triggered or ml_triggered:</code>; sin <code>else</code>, los vectores sin alerta no se guardan.</li>
<li>Posibles FN: checkout_drop no tiene regla propia. Posibles FP: alertas del modelo con latencia mediana 120,7 ms y 6–14 clics.</li>
<li>Precisión 1,000 en todas las capas; F1: reglas 0,601, IF 0,766, híbrido 1,000 (difiere el recall: 0,430 y 0,620).</li>
<li>Diseño: <code>is_anomaly</code> (OR en el reduce) y <code>anomaly_type</code> en un bloque <code>ground_truth</code> del JSON. El detector separa X (6 métricas → modelo) de y (etiquetas → se guardan) y compara por session_id.</li>
<li>Flink emite un único JSON por sesión y ventana; el detector lo usa dos veces (reglas y modelo). Ambas capas evalúan cada vector: por eso hay 686 de ambas.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Etiqueta = evaluar, NUNCA detectar: ni el modelo ni las reglas deben leerlas (fuga de información; en producción no existen). No digas "con las etiquetas la capa 1 habría detectado todo". Reconócelo como limitación antes de hablar de mejora. Di "alertas", no "anomalías". No digas "mejores resultados" sin ground truth.</div>`
},
{
 t:"Cómo decide Isolation Forest", topic:"Detector · modelo",
 q:"Expliquen cómo decide Isolation Forest si una sesión es anómala. ¿Qué hacen los 100 árboles, qué significa la profundidad y cómo se convierte eso en el score que aparece en su CSV?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Isolation Forest no aprende lo normal: mide qué tan fácil es aislar un punto. Cada uno de sus 100 árboles, el valor por defecto, parte los datos con cortes al azar: una métrica y un valor entre su mínimo y su máximo. Un punto anómalo se aísla con pocos cortes; uno normal necesita muchos.</p>
<p>Cada vector obtiene su profundidad en los 100 árboles; se promedian, y la fórmula de Liu, Ting y Zhou convierte esa profundidad media en un score. En scikit-learn es negativo: más negativo, más anómalo.</p>
<p>El umbral se fijó al entrenar: el percentil 8 de los scores de los 40 vectores del warmup, porque contamination es 0,08; deja unos 3 por debajo. Lo inferimos en torno a −0,60. Todo vector nuevo con score menor se marca como alerta.</p></div>
<h3>Del árbol al score</h3>
<pre>100 árboles → 100 profundidades → promedio E[h] → fórmula → 1 score

s(x) = 2^( −E[h(x)] / c(n) )     c(40) ≈ 6,53
scikit-learn devuelve −s</pre>
<div class="tbl"><table>
<tr><th>Vector (ilustrativo)</th><th class="num">E[h]</th><th class="num">Score</th></tr>
<tr><td>Normal</td><td class="num">5,5</td><td class="num">−0,56</td></tr>
<tr><td>En el borde</td><td class="num">4,8</td><td class="num">−0,60</td></tr>
<tr><td>Anómalo</td><td class="num">3,2</td><td class="num">−0,71</td></tr>
</table></div>
<ul class="pts">
<li>100 árboles: <code>n_estimators</code> por defecto; no está escrito en <code>IsolationForest(contamination=0.08, random_state=42)</code>.</li>
<li>Muestra por árbol min(256, n) = 40. Profundidad máx. ⌈log2 40⌉ = 6: depende de las muestras, no de las 6 variables.</li>
<li>Umbral = percentil, no promedio. 40 × 8 % = 3,2. Es −0,60 porque es el score menos negativo entre las alertas del modelo (offset_ no se guardó). Alertas ML: −0,68 a −0,60.</li>
<li>Los 40 vectores: <code>warmup_samples_required</code>; el <code>fit</code> se dispara al llegar a 40.</li>
<li>ML_Score = 0,0 en el CSV no es un score real: es el valor cuando el modelo no disparó.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Se promedian profundidades, no scores. Autores: LIU, Ting y ZHOU (2008). No digas "el score decide": decide <code>predict</code> contra el umbral. Contamination es 0,08 (8 %), no 0,8. Las sesiones normales quedan cerca de −0,5, no "cerca de cero". Di "el menos negativo", no "el menor negativo".</div>`
},
{
 t:"Warmup y reproducibilidad", topic:"Detector · modelo",
 q:"Su modelo se entrena con 40 vectores y contamination = 0,08, y en 5.5.4 afirman que random_state=42 hace el modelo reproducible entre ejecuciones. ¿Es realmente reproducible? ¿Y por qué 40 vectores?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>random_state=42 fija el azar del algoritmo: con los mismos datos, produce los mismos árboles y el mismo umbral. Pero el warmup son los primeros 40 vectores del flujo en vivo, y cambian en cada ejecución. La reproducibilidad de 5.5.4 es del algoritmo, no de los resultados: las cifras de 5.8 corresponden a una ejecución concreta.</p>
<p>Para que fuera reproducible grabaríamos los eventos una vez y los reproduciríamos en cada prueba, leyendo desde earliest y con ventanas por event time, para que dependan del timestamp del evento y no del momento en que Flink lo recibe. Como mínimo, guardaríamos el modelo entrenado.</p>
<p>Los 40 vectores fueron una decisión práctica para empezar a detectar en pocos segundos. Es una muestra pequeña: con 8 %, el umbral depende de unos 3 vectores, y el warmup no se filtra ni se reentrena. Lo mejoraríamos con un warmup mayor, filtrado por las reglas, guardado y con reentrenamiento periódico.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th>Solución</th><th>Modelo reproducible</th><th>Alertas reproducibles</th></tr>
<tr><td>Semilla en el faker</td><td>No del todo</td><td>No (uuid4, processing time, latest)</td></tr>
<tr><td>Grabar y reproducir + event time + earliest</td><td>Sí</td><td>Sí</td></tr>
<tr><td>Guardar el modelo (joblib)</td><td>Sí</td><td>No</td></tr>
</table></div>
<ul class="pts">
<li>Reproducible = repetir en las mismas condiciones y obtener el mismo resultado. Semilla = condición necesaria, no suficiente.</li>
<li>La memoria lo dice dos veces: en la explicación del score (casi defendible) y junto a la Tabla 14 (resultados, la problemática).</li>
<li>contamination = 0,08 es decisión de diseño, igual al anomaly_ratio del generador, dato que en producción no se conoce. Más alto → más FP; más bajo → más FN. Alternativas: 'auto' (umbral −0,5 del paper) o calibrar contra ground truth maximizando F1.</li>
<li>Otra imprecisión: la memoria dice que marca el "8 % más extremo". El 8 % solo fija el umbral al entrenar; después el umbral es fijo y se aplica vector a vector.</li>
<li>Los 40 del warmup, incluido el 40, no pasan por el modelo; sin reentrenamiento, no hay adaptación a cambios de comportamiento.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> No digas "random_state garantiza reproducibilidad". No digas "con Faker.seed() se resolvía". No digas "el 8 % es el estándar". No justifiques el tamaño del warmup con falta de memoria ni con "fue el mínimo".</div>`
},
{
 t:"Por qué el reduce no divide", topic:"Flink · agregación",
 q:"En su procesador de Flink, el reduce no calcula la latencia media: acumula sumas y conteos, y la división se hace después, en un map. ¿Por qué? ¿No sería más simple promediar en el reduce?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Porque el promedio no es asociativo. El reduce combina los elementos de dos en dos, a medida que llegan. Con 100, 200 y 600 ms, la media real es 300; promediando de dos en dos sale 375, porque cada paso da más peso al último evento.</p>
<p>La suma y el conteo sí son asociativos. El reduce acumula suma de latencias y número de eventos, y el map, al cerrar la ventana, hace una sola división: 900 entre 3, 300. Además, el estado por sesión son solo unos pocos números.</p></div>
<h3>El ejemplo</h3>
<div class="tbl"><table>
<tr><th>Paso</th><th>Promediando ❌</th><th>Suma y conteo ✅</th></tr>
<tr><td>100 ms</td><td class="num">100</td><td>(100, 1)</td></tr>
<tr><td>+ 200 ms</td><td class="num">150</td><td>(300, 2)</td></tr>
<tr><td>+ 600 ms</td><td class="num">375</td><td>(900, 3)</td></tr>
<tr class="total"><td>Cierre (map)</td><td class="num">375</td><td>900 / 3 = 300</td></tr>
</table></div>
<ul class="pts">
<li>Asociativo: (a + b) + c = a + (b + c).</li>
<li>Con paralelismo, Flink podría combinar parciales en otro orden: con sumas y conteos el resultado no cambia.</li>
<li>Los conteos se suman directamente; solo la latencia necesita numerador y denominador.</li>
<li>Alternativa idiomática: <code>AggregateFunction</code> (add, merge, get_result).</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> La razón es matemática, no "ahorrar memoria". El reduce combina cada evento al llegar; solo la división espera al cierre.</div>`
},
{
 t:"Registros corruptos sin DLQ", topic:"Flink · calidad de datos",
 q:"En Flink filtran los registros malformados marcándolos como CORRUPT_RECORD. ¿Qué pasa con esos registros después? ¿Qué harían en un sistema en producción?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>El primer map marca como CORRUPT_RECORD los eventos con JSON ilegible y los que no traen session_id; el filter los elimina antes del key_by, así que no entran al estado de ninguna sesión. Pero se pierden: solo queda una línea en el log, y si falta el session_id, ni eso.</p>
<p>Los demás campos faltantes se rellenan: sin tipo cuenta como page_view y sin latencia entra con cero, lo que baja la media de la sesión y puede parecerse a un bot.</p>
<p>En producción usaríamos una dead-letter queue: un tópico aparte con el registro y el error, para analizarlo, y una métrica que cuente los fallos; si sube, algo falla aguas arriba.</p></div>
<h3>Qué hace el código</h3>
<div class="tbl"><table>
<tr><th>Caso</th><th>Tratamiento</th><th>¿Llega a la ventana?</th></tr>
<tr><td>JSON ilegible o error de tipo</td><td>log + CORRUPT_RECORD</td><td>No</td></tr>
<tr><td>Sin session_id</td><td>CORRUPT_RECORD sin log</td><td>No</td></tr>
<tr><td>Sin latency</td><td>latencia 0</td><td>Sí: baja la media</td></tr>
<tr><td>Sin event_type</td><td>page_view</td><td>Sí</td></tr>
<tr><td>Sin device / user_id</td><td>"unknown" / "anonymous"</td><td>Sí</td></tr>
</table></div>
<ul class="pts">
<li>DLQ = dead-letter queue, cola de mensajes fallidos. En Flink: salida lateral (side output con OutputTag) hacia un tópico como ecommerce-events-dlq.</li>
<li>La memoria (tras la Tabla 11) dice que el filtro evita contaminar el estado: cierto para ilegibles, no para campos faltantes.</li>
<li>El generador produce JSON válido: no hay evidencia de que el filtro se activara.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> DLQ, no "QLD". Sin latencia se asigna cero, no el promedio; sin tipo, page_view, no "home". Es la latencia del evento, no avg_latency. No digas "se guardan para análisis" ni "valida todos los campos": solo exige session_id.</div>`
},
{
 t:"Listeners de Kafka y KRaft", topic:"Kafka · infraestructura",
 q:"Su Kafka corre en modo KRaft y expone dos listeners, INTERNAL en el 9092 y EXTERNAL en el 9094. ¿Por qué necesitan dos? ¿Qué aporta KRaft frente a ZooKeeper y qué limitaciones tiene su configuración?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Un listener es una dirección por la que el broker acepta conexiones. Necesitamos dos porque hay clientes en dos redes. Tras conectarse, el broker le anuncia al cliente qué dirección usar: kafka:9092 a los contenedores y localhost:9094 al host, porque el nombre kafka solo existe dentro de Docker. Solo el 9094 está publicado. Hay un tercero, CONTROLLER en el 9093, que usa KRaft.</p>
<p>Los metadatos del clúster son el registro de tópicos, particiones y qué broker lidera cada una. Antes vivían en ZooKeeper, un sistema aparte. Con KRaft, Kafka gestiona sus propios metadatos: los controladores se coordinan con el protocolo Raft, por mayoría. Un sistema en lugar de dos y recuperación más rápida.</p>
<p>Las limitaciones son de desarrollo: el mismo proceso de tfm-kafka es broker y controlador, y es el único votante; si cae, no hay quórum. Sin réplica y en texto plano. En producción usaríamos tres controladores, varios brokers y TLS con autenticación.</p></div>
<h3>Listeners en el docker-compose</h3>
<div class="tbl"><table>
<tr><th>Listener</th><th>Anuncia</th><th>Lo usan</th></tr>
<tr><td>INTERNAL :9092</td><td>kafka:9092</td><td>Contenedores (el job, si corriera en clúster)</td></tr>
<tr><td>EXTERNAL :9094</td><td>localhost:9094</td><td>Todos los scripts del host, incluido Flink embebido</td></tr>
<tr><td>CONTROLLER :9093</td><td>—</td><td>Quórum KRaft</td></tr>
</table></div>
<h3>Roles y datos</h3>
<pre>Metadatos    = el inventario (tópicos, particiones, líderes)
Controlador  = el rol que administra ese inventario
Broker       = el rol que guarda y entrega los mensajes

Hoy:          tfm-kafka → broker + controlador, 1 votante
Producción:   C1 C2 C3 (controladores) + B1 B2 B3 (brokers)</pre>
<div class="tbl"><table>
<tr><th class="num">Votantes</th><th class="num">Fallos que tolera</th></tr>
<tr><td class="num">1 (el suyo)</td><td class="num">0</td></tr>
<tr><td class="num">3</td><td class="num">1</td></tr>
<tr><td class="num">5</td><td class="num">2</td></tr>
</table></div>
<ul class="pts">
<li>Jerarquía: host (PC) → Docker con 3 contenedores → 2 clústeres (Kafka de 1 broker; Flink ocioso).</li>
<li>cp-kafka 7.6.0 = Kafka 3.6. KRaft apto para producción desde 3.3; Kafka 4.0 eliminó ZooKeeper.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Externo = localhost:9094, no kafka:9094; interno = 9092, no 9002. KRaft no es "metadatos y broker en el mismo nodo": eso es su configuración de desarrollo. El controlador no es el host: es un rol del mismo proceso Kafka. La memoria habla de dos listeners; hay tres. No digas "Docker tiene tres clústeres".</div>`
}
,
{
 t:"Marco teórico: pilares y autores", topic:"Marco teórico",
 q:"¿Sobre qué pilares teóricos se apoya su trabajo y qué autor sostiene cada uno?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Nuestro trabajo se apoya en cuatro pilares.</p>
<p>El primero es el procesamiento en flujo. Carbone y colaboradores, en 2015, presentan Flink como un motor único que unifica flujo y lotes. De ahí tomamos el estado por sesión y las ventanas. El contraste es el data warehouse por lotes de Kimball y Ross.</p>
<p>El segundo es la detección de anomalías. Chandola y colaboradores, en 2009, clasifican las técnicas según la necesidad de etiquetas. En producción, las anomalías nuevas no llegan etiquetadas; por eso elegimos el enfoque no supervisado: Isolation Forest, de Liu, Ting y Zhou, en 2008, que aísla lo anómalo en pocos cortes.</p>
<p>El tercero es la minería de uso web. Srivastava y colaboradores, en 2000, la dividen en preprocesamiento, descubrimiento y análisis de patrones; nuestras capas siguen esa separación, pero en flujo continuo. Bucklin y Sismeiro, en 2009, muestran el valor del clickstream por sesión.</p>
<p>Y por último, los grafos de navegación. Newman, en 2010, da la definición formal del grafo dirigido y ponderado. Huidobro y colaboradores, en 2022, aplican esa idea a la navegación: la representan como grafo para ver el recorrido del usuario y en qué punto abandona el sitio.</p>
<p>Nuestro aporte es unir estos cuatro pilares en un solo pipeline en tiempo real.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th>Pilar</th><th>Pregunta</th><th>Autores</th></tr>
<tr><td>Stream</td><td>¿Cómo procesar al instante?</td><td>Carbone (+ Kimball y Ross, contraste)</td></tr>
<tr><td>Anomalías</td><td>¿Cómo detectar sin etiquetas?</td><td>Chandola → Liu, Ting y Zhou</td></tr>
<tr><td>Minería de uso web</td><td>¿Qué datos y a qué nivel?</td><td>Srivastava, Bucklin y Sismeiro</td></tr>
<tr><td>Grafos</td><td>¿Cómo representar la navegación?</td><td>Newman (definición) → Huidobro (aplicación)</td></tr>
</table></div>
<ul class="pts">
<li>Chandola clasifica según etiquetas: supervisada (normal + anómalo etiquetados), semisupervisada (solo normal), no supervisada (ninguna).</li>
<li>Grafo dirigido = cada transición tiene sentido (Carrito → Checkout ≠ Checkout → Carrito). Ponderado = el peso cuenta cuántas veces ocurrió (grosor). G = (V, E, W): 9 categorías, transiciones, conteos.</li>
<li>La minería web tiene tres ramas: contenido, estructura y uso. La nuestra es la de uso (clickstream).</li>
<li>Kimball: no lo reemplazamos, lo complementamos con tiempo real.</li>
<li>Li et al. (2025): trabajo reciente de una línea antigua (predicción de la siguiente página). Offline; integrarlo es trabajo futuro.</li>
<li>Pronunciación: car-BÓ-ne · chan-DÓ-la · LIÚ, TING y CHÓU · sri-VÁS-ta-va · BÁK-lin y sis-MÉI-ro · ui-DÓ-bro · NIÚ-man.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Carbone, no "Carbonet". Flink es un motor único para flujo y lotes, no "el único motor de streaming". Chandola "clasifica", no "presenta"; es una revisión. Srivastava: PREprocesamiento, tres fases. Isolation Forest aísla el VECTOR de la sesión, no eventos. Newman solo para la definición: no calculamos centralidad ni ciclos. En el repaso del 28 set: nombres y Newman antes que Huidobro.</div>`
},
{
 t:"Qué tomamos de cada paper", topic:"Marco teórico",
 q:"Citan nueve referencias en el marco teórico. ¿Qué tomaron realmente de cada una y qué dejaron fuera?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>De cada referencia tomamos una pieza concreta del sistema, y dejamos fuera lo que el prototipo no implementa.</p>
<p>De Carbone tomamos el modelo de Flink: estado por clave y ventanas. No activamos event time, checkpoints ni exactly-once, que son capacidades del motor.</p>
<p>De Chandola, la clasificación por etiquetas; no usamos ninguna técnica concreta de su revisión. De Liu, Ting y Zhou, el algoritmo y su score, pero con una muestra de 40 vectores en lugar de los 256 que recomiendan.</p>
<p>De Srivastava, la separación en fases y la sesión como unidad de análisis; no sus técnicas de minería. De Bucklin y Sismeiro, el valor del clickstream por sesión, no sus modelos de marketing.</p>
<p>De Huidobro, la idea del grafo de navegación y el abandono, no su método de gramáticas. De Newman, solo la definición formal. De Kimball, el contraste con el data warehouse, no el modelado dimensional. Y de Li, el contexto de la predicción, que queda como trabajo futuro.</p></div>
<h3>Tomamos · no tomamos</h3>
<div class="tbl"><table>
<tr><th>Autor</th><th>Tomamos</th><th>No tomamos</th></tr>
<tr><td>Carbone et al. (2015)</td><td>DataStream, key_by, ventanas, reduce</td><td>Event time, checkpoints ABS, exactly-once, Gelly</td></tr>
<tr><td>Kimball y Ross (2013)</td><td>Contraste batch</td><td>Modelado dimensional (incluido su capítulo de clickstream)</td></tr>
<tr><td>Chandola et al. (2009)</td><td>Clasificación por etiquetas; anomalía puntual</td><td>Técnicas concretas; anomalías contextuales o colectivas</td></tr>
<tr><td>Liu, Ting y Zhou (2008)</td><td>Aislamiento, E[h(x)], c(n), score; 100 árboles</td><td>Submuestra ψ = 256: usamos 40 (warmup)</td></tr>
<tr><td>Srivastava et al. (2000)</td><td>Tres fases; sesión como unidad</td><td>Reglas de asociación, clustering, patrones secuenciales</td></tr>
<tr><td>Bucklin y Sismeiro (2009)</td><td>Valor del clickstream por sesión</td><td>Modelos de marketing y publicidad</td></tr>
<tr><td>Huidobro et al. (2022)</td><td>Grafo de navegación; transiciones que llevan al abandono</td><td>Sequitur, reglas de alto nivel, clases de visitantes</td></tr>
<tr><td>Newman (2010)</td><td>G = (V, E, W) dirigido y ponderado</td><td>Densidad, centralidad, ciclos</td></tr>
<tr><td>Li et al. (2025)</td><td>Contexto: predicción de la siguiente página</td><td>Markov, predicción (trabajo futuro)</td></tr>
</table></div>
<ul class="pts">
<li>Liu recomienda ψ = 256 y t = 100 por defecto. Con 40 vectores, ψ = 40 y la profundidad máxima es ⌈log2 40⌉ = 6.</li>
<li>Cada vector de sesión y ventana se evalúa como anomalía puntual (tipología de Chandola).</li>
<li>Huidobro comprime sesiones con Sequitur; nuestro grafo usa 9 categorías fijas y cuenta transiciones.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Estructura cada respuesta como "tomamos X; no Y" (en el repaso del 28 set solo dijiste qué propone cada autor). Di "no implementamos", nunca "no sirve". El 256 de Liu es un valor por defecto, no un mínimo. No improvises detalles del método de Huidobro más allá de Sequitur y reglas.</div>`
},
{
 t:"Estado del arte: la brecha", topic:"Estado del arte",
 q:"Google Analytics 4 y Mixpanel ya detectan anomalías con aprendizaje automático. ¿Qué aporta su trabajo que no exista ya? ¿Cuál es exactamente la brecha?",
 a:`<h3>Para decir en voz alta (guion de la slide 5, 1:10)</h3>
<div class="say"><p>¿Qué existe hoy y qué falta? Para responderlo, comparamos cuatro referentes con nuestra propuesta.</p>
<p>Google Analytics 4 y Mixpanel detectan anomalías, pero sobre métricas agregadas, por hora o por día, no por sesión; y son plataformas cerradas.</p>
<p>Chandola y colaboradores revisan las técnicas de detección; es una revisión, no un sistema.</p>
<p>Huidobro y Li trabajan la navegación, como grafo o como predicción, pero sobre datos históricos y sin detectar anomalías.</p>
<p>Nuestra propuesta evalúa cada sesión en ventanas de 10 segundos, con reglas e Isolation Forest, y construye el grafo desde el flujo.</p>
<p>La brecha es la integración: ninguno de los enfoques revisados reúne las cuatro capacidades.</p></div>
<h3>Las cinco partes que pueden preguntar por separado</h3>
<div class="tbl"><table>
<tr><th>Parte</th><th>Respuesta corta</th></tr>
<tr><td>23a · ¿Por qué no bastan GA4 y Mixpanel?</td><td>Cuatro razones: métricas agregadas por hora o día, no por sesión; detectan el síntoma, no el comportamiento; recorridos sin grafo formal; SaaS cerrado</td></tr>
<tr><td>23b · ¿Por qué Chandola con "—"?</td><td>Revisión → raya; sistema sin la capacidad → equis</td></tr>
<tr><td>23c · ¿Qué le falta a Huidobro?</td><td>Grafo estático desde logs; sin detección; datos no públicos (no "código")</td></tr>
<tr><td>23d · ¿En qué se diferencia Li?</td><td>Primero predecir ≠ detectar; después offline ≠ flujo. Código y datos públicos</td></tr>
<tr><td>23e · ¿Qué cubre su columna?</td><td>Herramientas de código abierto; transiciones fuera del recorrido esperado; la brecha es la integración, no cada pieza</td></tr>
</table></div>
<h3>Datos verificados</h3>
<ul class="pts">
<li>GA4: modelo bayesiano state-space sobre series, con intervalo creíble; también detección por segmentos con PCA. No digas "una métrica por vez": di "sobre métricas agregadas, no por sesión".</li>
<li>Mixpanel: alertas sobre Insights y Funnels, umbral fijo o detección de anomalías; Prophet → TimesFM V2 (2026); evaluación como mínimo por hora; solo planes pagados.</li>
<li>Multivariable = varias métricas a la vez. Las 7,810 alertas solo-IF tienen latencia ~120 ms y 6–14 clics: cada valor es normal, la combinación no.</li>
<li>Li: la predicción de la siguiente página viene de Sarukkai (2000) y Deshpande y Karypis (2004), que no están en la bibliografía de la memoria.</li>
<li>La slide 5 sintetiza y precisa la Tabla 3; la conclusión no cambia.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> No digas que GA4 o Mixpanel no detectan anomalías: sí lo hacen, sobre agregados. Di "ninguno de los enfoques revisados", nunca "nadie en el mundo". Evita "mejor" o "superior": usa "integra" y "complementa". "Tiempo real" = ventanas de 10 s.</div>`
},
{
 t:"Riesgos de la Tabla 3", topic:"Estado del arte · riesgo",
 q:"En su Tabla 3 afirman \"streaming evento a evento\", \"ML no supervisado por sesión en tiempo real\" y una integración \"reproducible\". ¿Se sostienen esas celdas con lo que implementaron?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>La conclusión de la tabla se sostiene, pero tres celdas de nuestra columna hay que leerlas con precisión.</p>
<p>"Evento a evento": cada evento entra a Flink y actualiza el estado de su sesión al llegar, pero la alerta se emite al cerrar la ventana de 10 segundos. Es procesamiento en flujo con ventanas.</p>
<p>"ML en tiempo real": la inferencia sí es en tiempo real, cada vector se evalúa al llegar. El entrenamiento no: el modelo se ajusta una sola vez con los primeros 40 vectores.</p>
<p>"Reproducible": la infraestructura se levanta igual con Docker Compose, pero las cifras exactas corresponden a una ejecución concreta; el warmup sale del flujo en vivo.</p>
<p>Sobre los otros referentes, en la presentación precisamos la tabla: Chandola es una revisión, no un sistema, y Huidobro no publica sus datos. La brecha, la integración de las cuatro capacidades, no cambia.</p></div>
<h3>Lectura precisa de cada celda</h3>
<div class="tbl"><table>
<tr><th>Celda</th><th>Riesgo</th><th>Lectura precisa</th></tr>
<tr><td>"Streaming evento a evento"</td><td>La alerta sale al cerrar la ventana</td><td>Estado por evento; emisión por ventana de 10 s</td></tr>
<tr><td>"ML no supervisado en tiempo real"</td><td>Modelo entrenado una sola vez</td><td>Inferencia en tiempo real; entrenamiento único con 40 vectores</td></tr>
<tr><td>"Docker Compose, reproducible"</td><td>Resultados no repetibles</td><td>Infraestructura reproducible; cifras de una ejecución</td></tr>
<tr><td>"Grafo dinámico, evento a evento"</td><td>Bajo</td><td>Cada mensaje suma 1 a su arista; la vista se refresca por ciclos</td></tr>
<tr><td>Chandola "batch / offline"</td><td>La revisión incluye técnicas en línea</td><td>Revisión, no sistema (—)</td></tr>
<tr><td>Papers "open source ✓"</td><td>Huidobro no publica datos</td><td>Académico ≠ abierto y desplegable</td></tr>
</table></div>
<div class="careful"><strong>Cuida esto.</strong> Reconoce la precisión antes de que la señalen; no digas "la tabla está mal". "Reproducible" = la infraestructura, nunca las cifras (en el repaso del 28 set dijiste "sí, es reproducible"). No olvides la celda "ML en tiempo real": inferencia sí, entrenamiento una vez con 40.</div>`
},
{
 t:"Supervisado, no supervisado e híbrido", topic:"Detección",
 q:"Su generador etiqueta cada evento como anómalo o normal. ¿Por qué no entrenaron un modelo supervisado? ¿Y por qué combinar reglas con Isolation Forest en lugar de usar solo uno?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Un modelo supervisado necesita anomalías etiquetadas para aprender. Nuestras etiquetas existen solo porque los datos son sintéticos; en producción, un ataque nuevo no llega etiquetado. Si entrenáramos con ellas, el modelo aprendería solo los tres tipos que inyectamos y el resultado no sería realista.</p>
<p>Un semisupervisado aprende solo lo normal, pero necesita datos normales limpios. Nuestro warmup toma los primeros 40 vectores sin filtrar, y puede incluir anomalías.</p>
<p>Por eso elegimos lo no supervisado: Isolation Forest asume que las anomalías son pocas y distintas, y no necesita etiquetas.</p>
<p>Y lo combinamos con reglas porque cubren cosas distintas. Las reglas detectan firmas conocidas, funcionan desde el primer vector y son explicables. El modelo detecta combinaciones atípicas que ninguna regla describe. Los datos lo muestran: el modelo no marcó ninguno de los 3,011 bots, que capturó la regla R1, y las reglas no marcaron 7,810 alertas que solo vio el modelo.</p></div>
<h3>Puntos clave</h3>
<div class="tbl"><table>
<tr><th>Enfoque</th><th>Qué necesita</th><th>En el TFM</th></tr>
<tr><td>Supervisado</td><td>Anomalías y normales etiquetados</td><td>No: en producción no hay etiquetas; aprendería solo 3 tipos</td></tr>
<tr><td>Semisupervisado</td><td>Solo normales, pero limpios</td><td>No hoy: warmup sin filtrar. Con warmup filtrado por reglas, se acercaría</td></tr>
<tr><td>No supervisado</td><td>Nada; supone anomalías pocas y distintas</td><td>Sí: Isolation Forest, contamination = 0.08</td></tr>
</table></div>
<div class="tbl"><table>
<tr><th>Capa</th><th>Fortaleza</th><th>Límite</th><th>Evidencia</th></tr>
<tr><td>Reglas</td><td>Firmas conocidas, activas desde el vector 1, explicables</td><td>Solo detectan lo previsto</td><td>R1 = 3,011 bots; R3 nunca disparó</td></tr>
<tr><td>Isolation Forest</td><td>Combinaciones atípicas en 6 métricas</td><td>No explica el porqué; entrenado una vez</td><td>7,810 alertas solo-IF; 0 bots</td></tr>
</table></div>
<div class="careful"><strong>Cuida esto.</strong> Falta en el repaso del 28 set: por qué no usar las etiquetas aunque existan, el semisupervisado y las cifras 0 de 3,011 y 7,810. "Cubrir todos" supone ground truth. No digas "el híbrido es mejor": di "las capas se complementan". Etiquetas = evaluar, NUNCA detectar. El modelo no ve device: por eso no ve los bots.</div>`
},
{
 t:"Objetivos y su alcance", topic:"Objetivos",
 q:"Enuncien el objetivo general y los específicos. ¿Los alcanzaron todos?",
 a:`<h3>Para decir en voz alta (guion de la slide 6, 1:17)</h3>
<div class="say"><p>Nuestro objetivo general es diseñar, desarrollar y validar una arquitectura de stream processing para observar el comportamiento del usuario y detectar anomalías de forma proactiva. Lo dividimos en cinco objetivos.</p>
<p>Los cuatro primeros siguen el recorrido del dato. Primero, capturar los eventos de navegación con Kafka, a partir de un generador sintético. Segundo, convertirlos en un vector por sesión con Flink, y construir el grafo de navegación desde el mismo flujo. Tercero, detectar anomalías con reglas e Isolation Forest, sin datos etiquetados. Cuarto, desarrollar un dashboard analítico e interactivo que muestre las alertas y el grafo.</p>
<p>El quinto evalúa el sistema completo: que la alerta se publique en menos de tres segundos tras cerrar la ventana, y comparar el time-to-insight frente al procesamiento por lotes.</p></div>
<h3>Si preguntan "¿los alcanzaron?"</h3>
<div class="say"><p>Los cuatro primeros, sí. El quinto, de forma parcial: la latencia la observamos, no la medimos, y la reducción del time-to-insight frente a batch está argumentada, no medida.</p></div>
<div class="tbl"><table>
<tr><th>OE</th><th>Qué</th><th>Capas</th><th>Estado</th></tr>
<tr><td>OE1 Ingesta</td><td>Kafka + generador Faker</td><td>1 y 2</td><td>Alcanzado ("escalable" por diseño; 1 broker, 1 partición)</td></tr>
<tr><td>OE2 Procesamiento</td><td>Vector por sesión (Flink) y grafo (dashboard)</td><td>3 y 5</td><td>Alcanzado</td></tr>
<tr><td>OE3 Detección</td><td>Reglas + Isolation Forest, sin etiquetas</td><td>4</td><td>Alcanzado</td></tr>
<tr><td>OE4 Observabilidad</td><td>Dashboard Streamlit (MVP) con grafo</td><td>5</td><td>Alcanzado</td></tr>
<tr><td>OE5 Evaluación</td><td>Latencia del pipeline &lt; 3 s y time-to-insight frente a batch</td><td>Ninguna: evalúa todo</td><td>Parcial</td></tr>
</table></div>
<ul class="pts">
<li>Memoria (conclusiones): OE5 "alcanzado en arquitectura y comportamiento operativo, pendiente de instrumentación formal".</li>
<li>El "&gt; 50 % de reducción del time-to-insight" que promete el OE5 no se midió.</li>
<li>Colores: la slide 6 muestra la estructura (azul OE1–4, gris OE5); la 17 muestra el estado (verde alcanzado, naranja parcial).</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Los OE no corresponden uno a uno con las 5 capas: nunca digas "uno por capa". El grafo lo construye el dashboard, no Flink. No digas "alta precisión" en el OE3. En la slide 6 no des resultados: el estado va en la 15 y la 17.</div>`
},
{
 t:"Hipótesis y cómo se contrastan", topic:"Hipótesis",
 q:"¿Cuáles son sus hipótesis de investigación y cómo se contrasta cada una?",
 a:`<h3>Para decir en voz alta (guion de la slide 7, 1:01)</h3>
<div class="say"><p>Del objetivo general derivamos tres hipótesis, cada una con una forma concreta de contrastarla.</p>
<p>H1, el rendimiento en tiempo real: la alerta se publica en menos de tres segundos tras el cierre de la ventana. La contrastamos observando, en operación, el tiempo entre el cierre de la ventana y la publicación de la alerta.</p>
<p>H2, nuestra hipótesis central: la combinación de reglas e Isolation Forest supera en recall y F1 a cada capa aislada. La contrastamos comparando las métricas de cada enfoque.</p>
<p>H3, la complementariedad: las capas detectan subconjuntos mayormente distintos y coinciden en lo más severo. La contrastamos midiendo el porcentaje de alertas marcadas por ambas capas.</p>
<p>Los resultados los veremos al final.</p></div>
<div class="tbl"><table>
<tr><th>Hipótesis</th><th>Se contrasta con</th><th>Resultado</th></tr>
<tr><td>H1 Rendimiento</td><td>Tiempo cierre de ventana → alerta, observado en operación</td><td>Sustentada por observación</td></tr>
<tr><td>H2 Híbrido (central)</td><td>Recall y F1 de reglas, IF e híbrido</td><td>Validada en términos relativos</td></tr>
<tr><td>H3 Complementariedad</td><td>% de alertas marcadas por ambas capas</td><td>Validada: 686 de 13,696 = 5 %</td></tr>
</table></div>
<ul class="pts">
<li>H1: la memoria promete "milisegundos" apoyándose en Carbone, no en una medición propia.</li>
<li>H2 es circular: el universo son las alertas y el híbrido cubre el 100 % por construcción. Lo informativo: reglas 43 %, IF 62 %.</li>
<li>H3 es la mejor sustentada, pero depende de la configuración del generador.</li>
<li>Los 2,000 ms de R2 (latencia que vive el usuario) no son los 3 s de H1 (latencia del pipeline). No se contradicen.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> H1: "sustentada por observación", nunca "validada" ni "medida". Si interrumpen "¿la superó?" (H2): el híbrido cubre por definición todo el registro; lo informativo es cuánto deja fuera cada capa sola. En la slide 7 no adelantes resultados.</div>`
},
{
 t:"Validación de hipótesis y F1", topic:"Evaluación",
 q:"¿Se validaron sus hipótesis? Expliquen qué significan Precision, Recall y F1 y con qué valores los calcularon.",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Las tres tienen respaldo, pero con distinto grado de evidencia.</p>
<p>H1, el rendimiento, está sustentada por observación. En operación, las alertas aparecen tras el cierre de cada ventana. Pero no la medimos: el vector no lleva marca de tiempo, así que no hay dos instantes que restar.</p>
<p>H2, la hipótesis central, está validada en términos relativos. Evaluamos sobre el registro de alertas, 13,696 filas. Todas son alertas, así que la precisión es 1 por construcción y el híbrido cubre el 100 % por definición. Lo informativo es cuánto cubre cada capa sola. Las reglas, el 43 %, con un F1 de 0.601. Isolation Forest, el 62 %, con un F1 de 0.766.</p>
<p>H3, la complementariedad, es la mejor sustentada. Solo el 5 % de las alertas coincide en ambas capas, y son las de mayor latencia.</p>
<p>Lo que no podemos afirmar es cuántas alertas son anomalías reales. Para eso falta la matriz de confusión con las etiquetas del generador.</p></div>
<h3>Las tres métricas</h3>
<pre>              Es anomalía   No es anomalía
Hay alerta        TP             FP
No hay alerta     FN             TN
(2.ª letra = lo que dijo el sistema · 1.ª = si acertó)

Precision = TP / (TP + FP)   de lo que alerté, ¿cuánto era anomalía?  (fiabilidad)
Recall    = TP / (TP + FN)   de las anomalías, ¿cuántas detecté?      (cobertura)
F1        = 2·P·R / (P + R)  media armónica: castiga el desequilibrio
Con P = 1:  F1 = 2R / (1 + R)</pre>
<h3>Valores del CSV</h3>
<div class="tbl"><table>
<tr><th></th><th class="num">Solo reglas</th><th class="num">Solo IF</th><th class="num">Híbrido</th></tr>
<tr><td>TP (la capa alertó)</td><td class="num">5,886</td><td class="num">8,496</td><td class="num">13,696</td></tr>
<tr><td>FN (solo la otra capa alertó)</td><td class="num">7,810</td><td class="num">5,200</td><td class="num">0</td></tr>
<tr><td>FP · TN</td><td class="num">0 · 0</td><td class="num">0 · 0</td><td class="num">0 · 0</td></tr>
<tr><td>Precision</td><td class="num">1</td><td class="num">1</td><td class="num">1</td></tr>
<tr><td>Recall</td><td class="num">0.430</td><td class="num">0.620</td><td class="num">1</td></tr>
<tr><td>F1</td><td class="num"><span class="hl">0.601</span></td><td class="num"><span class="hl">0.766</span></td><td class="num"><span class="hl">1</span></td></tr>
<tr class="total"><td>Distancia al híbrido</td><td class="num">39.9 puntos</td><td class="num">23.4 puntos</td><td class="num">—</td></tr>
</table></div>
<h3>"Por construcción"</h3>
<ul class="pts">
<li>El detector solo guarda alertas, y la evaluación trata cada fila como anomalía. Sin nada "normal" en el universo, no puede haber falsos positivos: P = TP / (TP + 0) = 1.</li>
<li>Prueba: una capa que marcara 100 filas al azar tendría P = 100 / 100 = 1. El 1 no mide calidad.</li>
<li>Analogía: un inspector que solo registra lo que rechazó y asume que todo rechazo era defectuoso.</li>
<li>El caso más dudoso: las 7,810 de IF, con latencia normal (~120 ms); el modelo marca ~8 % por calibración.</li>
</ul>
<h3>Repreguntas</h3>
<ul class="pts">
<li>"¿H2 es tautológica?" → El 100 % sí; el tamaño de lo que cada capa deja fuera no. IF no marcó ninguno de los 3,011 bots.</li>
<li>"¿Por qué no F1 real?" → Flink descarta is_anomaly y solo se guardan alertas. Anexo A1.</li>
<li>"¿Qué aporta el F1 si P = 1?" → Nada que el recall no diga; es la métrica con la que se formuló H2.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> "Validada en términos relativos", nunca a secas. "El híbrido cubre todas las ALERTAS", no las anomalías. 43 % y 62 % = cobertura; 57 % y 38 % = lo que queda fuera. No repitas "pruebas de estrés" ni "holgadamente por debajo de 3 s". Precision es de las alertas; recall, de las anomalías.</div>`
},
{
 t:"Metodología e iteraciones", topic:"Metodología",
 q:"¿Qué metodología siguieron y por qué? ¿Cómo se organizaron las iteraciones?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Usamos una metodología ágil: un Scrum adaptado. Por dos razones. Teníamos un plazo fijo de ocho semanas, y el objetivo era un producto mínimo viable, funcional y auditable. En cascada, un error en la ingesta lo habríamos descubierto al final. Con iteraciones, cada capa quedaba funcionando antes de construir la siguiente.</p>
<p>Fueron cuatro sprints de dos semanas, que siguen el recorrido del dato. El primero, la ingesta: el generador con Faker y Kafka. El segundo, el procesamiento con Flink: el vector por sesión en ventanas de 10 segundos, y el modelo del grafo. El tercero, la detección: reglas e Isolation Forest. El cuarto, el dashboard y la evaluación.</p>
<p>El principio fue el timeboxing: cada sprint con un plazo cerrado. Y lo que no era crítico lo dejamos fuera a propósito: un frontend complejo y los datos reales, que además exige el marco normativo.</p></div>
<div class="tbl"><table>
<tr><th>Iteración</th><th>Semanas</th><th>Qué se construye</th><th>OE</th><th>Capas</th></tr>
<tr><td>I · Ingesta</td><td>1–2</td><td>Faker + Kafka</td><td>OE1</td><td>1 y 2</td></tr>
<tr><td>II · Procesamiento</td><td>3–4</td><td>Flink: vector por sesión; se DEFINE el grafo</td><td>OE2</td><td>3</td></tr>
<tr><td>III · Detección</td><td>5–6</td><td>Reglas + Isolation Forest</td><td>OE3</td><td>4</td></tr>
<tr><td>IV · Observabilidad y evaluación</td><td>7–8</td><td>Dashboard; se CONSTRUYE el grafo; evaluación</td><td>OE4 y OE5</td><td>5</td></tr>
</table></div>
<h3>Cinco frases de la memoria con respuesta preparada</h3>
<div class="tbl"><table>
<tr><th>Frase (3.4)</th><th>Respuesta</th></tr>
<tr><td>Iteración II: "Consumo y micro-batching"</td><td>Error de redacción. Flink procesa evento a evento y emite por ventanas; micro-batching es Spark, que descartamos (5.1.6)</td></tr>
<tr><td>Iteración IV: "pruebas de estrés incrementando la carga"</td><td>No se hicieron: carga constante de 30 eventos por segundo. Carga creciente = trabajo futuro</td></tr>
<tr><td>Iteración IV: "latencia E2E &lt; 3 s desde la emisión hasta el renderizado"</td><td>No alcanzable por diseño: con ventana de 10 s un evento espera hasta 10 s. Por eso H1 mide cierre de ventana → publicación</td></tr>
<tr><td>Iteración III: "clasificación en flujo" de checkout_drop, high_latency y bots</td><td>El sistema no clasifica el tipo: indica qué capa disparó. checkout_drop no tiene regla; solo IF podría captarlo, no confirmable sin etiquetas</td></tr>
<tr><td>Iteración I: "altamente disponible y tolerante a fallos"</td><td>Objetivo de diseño. Prototipo con 1 broker y RF 1: sin alta disponibilidad (anexo A4)</td></tr>
</table></div>
<ul class="pts">
<li>Flink procesa en flujo continuo: el reduce actualiza el estado de la sesión al llegar cada evento; la ventana solo decide cuándo se emite. En micro-batching, el procesamiento espera al lote.</li>
<li>"¿Cómo hicieron Scrum siendo dos?" → Adaptado: sprints, timeboxing y entrega incremental, sin roles formales. Confirmar con Benjamín tablero, revisiones y si se cumplió el Gantt (Figura 4).</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> Nunca "micro-batching" ni "micro-lotes" para Flink; nunca "Flink procesa por ventanas": procesa evento a evento y EMITE por ventanas. "Carga constante de 30 eventos por segundo", nunca "pruebas de estrés". La latencia de H1 es cierre de ventana → publicación, no emisión → renderizado.</div>`
},
{
 t:"Marco normativo", topic:"Marco normativo",
 q:"¿Qué marco normativo aplica a un sistema como el suyo y cómo lo resolvieron?",
 a:`<h3>Para decir en voz alta</h3>
<div class="say"><p>Un sistema que analiza el comportamiento de usuarios trata datos personales. No hacen falta nombres: una dirección IP o un identificador de cookie bastan para que una persona sea identificable.</p>
<p>Revisamos tres marcos. El europeo, porque UNIR es una universidad española: el RGPD y la ley española que lo adapta, la LOPD-GDD. El peruano y el colombiano, porque somos autores de esos países y el sistema está pensado para su comercio electrónico: en Perú, la Ley 29733, de 2011, y su reglamento de 2024; en Colombia, la Ley 1581, de 2012. Los tres comparten cuatro principios: consentimiento, minimización, finalidad y seguridad.</p>
<p>Nuestra respuesta fue una decisión de diseño: datos cien por ciento sintéticos, generados con Faker. No existe ningún titular real, así que la investigación queda fuera del ámbito de estas normas.</p>
<p>Para producción dejamos definido qué haría falta: base jurídica y consentimiento, incluido el de cookies; evaluación de impacto; oficial de datos; y atención de los derechos de los titulares.</p></div>
<div class="tbl"><table>
<tr><th>Marco</th><th>Norma</th><th>Por qué</th></tr>
<tr><td>UE · España</td><td>RGPD (UE) 2016/679 · LOPD-GDD 3/2018</td><td>UNIR es española</td></tr>
<tr><td>Perú</td><td>Ley 29733 (2011) · DS 016-2024-JUS</td><td>Autor y mercado; alcance extraterritorial por análisis de comportamiento</td></tr>
<tr><td>Colombia</td><td>Ley Estatutaria 1581 de 2012</td><td>Autor y mercado; habeas data</td></tr>
</table></div>
<h3>Seis puntos con respuesta preparada</h3>
<ul class="pts">
<li>DS 016-2024-JUS: la memoria dice que "entró en vigor en noviembre de 2024". Se publicó el 30 nov 2024 y está vigente desde fines de marzo de 2025. No cites número de artículo del alcance extraterritorial.</li>
<li>Colombia: el proyecto de reforma de 2025 se archivó por vencimiento de términos; la Ley 1581 sigue vigente sin cambios. En la slide: "(reforma pendiente)".</li>
<li>"El RGPD aplica a tratamientos a gran escala" (4.1.1): aplica a cualquier tratamiento de datos personales; gran escala y seguimiento sistemático son criterios de EIPD (art. 35) y DPO (art. 37).</li>
<li>"Si no aplica, ¿por qué el art. 25?" → Criterio de diseño para producción: identificadores seudónimos y campos mínimos.</li>
<li>Minimización: el vector lleva ip_address y user_id y la consola muestra la IP. Con datos reales, seudonimizar o truncar en la ingesta; el modelo no los usa.</li>
<li>"¿Una IP de Faker puede coincidir con una real?" → Sí, pero no está vinculada a ninguna persona ni actividad: no identifica a nadie.</li>
</ul>
<div class="careful"><strong>Cuida esto.</strong> "La investigación queda FUERA DEL ÁMBITO", nunca "los datos sintéticos cumplen el RGPD". En la ley peruana la minimización se llama principio de proporcionalidad. Reglamento peruano: publicado en noviembre de 2024, vigente desde marzo de 2025. No menciones multas.</div>`
}
];

const listEl=document.getElementById('qlist');
const tabs=[...document.querySelectorAll('.tabs button')];
let block=0, cur=0;
function store(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function load(k){try{return localStorage.getItem(k)}catch(e){return null}}

function renderList(){
  listEl.innerHTML='';
  tabs.forEach((b,i)=>b.setAttribute('aria-selected',i===block?'true':'false'));
  const start=block*10, items=Q.slice(start,start+10);
  if(!items.length){
    listEl.innerHTML='<li class="empty">Este bloque se llenará con las preguntas del simulacro que faltan.</li>';
    return;
  }
  items.forEach((it,k)=>{
    const i=start+k, li=document.createElement('li'), b=document.createElement('button');
    b.type='button'; b.id='q-btn-'+(i+1);
    b.innerHTML='<span class="n">'+String(i+1).padStart(2,'0')+'</span><span>'+it.t+'</span>';
    if(i===cur) b.setAttribute('aria-current','true');
    b.addEventListener('click',()=>show(i));
    li.appendChild(b); listEl.appendChild(li);
  });
}
function show(i){
  cur=i; const it=Q[i];
  document.getElementById('qnum').textContent=(i+1)+' de '+Q.length;
  document.getElementById('qtopic').textContent=it.topic;
  document.getElementById('qtext').textContent=it.q;
  const ans=document.getElementById('answer');
  ans.innerHTML=it.a; ans.style.animation='none'; void ans.offsetWidth; ans.style.animation='';
  document.getElementById('prev').disabled=i===0;
  document.getElementById('next').disabled=i===Q.length-1;
  block=Math.floor(i/10); renderList();
  store('tfm-repaso-q',String(i));
  if(history.replaceState) history.replaceState(null,'','#q'+(i+1));
}
tabs.forEach((b,i)=>b.addEventListener('click',()=>{block=i;renderList();}));
document.getElementById('prev').addEventListener('click',()=>cur>0&&show(cur-1));
document.getElementById('next').addEventListener('click',()=>cur<Q.length-1&&show(cur+1));
document.addEventListener('keydown',e=>{
  if(e.target.closest('input,textarea'))return;
  if(e.key==='ArrowRight'&&cur<Q.length-1)show(cur+1);
  if(e.key==='ArrowLeft'&&cur>0)show(cur-1);
});
let start=0;
const m=location.hash.match(/^#q(\d+)$/);
if(m) start=Math.min(Q.length,Math.max(1,+m[1]))-1;
else { const s=+load('tfm-repaso-q'); if(s>=0&&s<Q.length) start=s; }
show(start);
</script>

</body></html>
